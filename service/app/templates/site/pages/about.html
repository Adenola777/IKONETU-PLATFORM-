t exists</h2></div><div class="c7"><p style="margin:0 0 16px;font-size:18px;color:#344054">Many founders build real businesses whose progress is hard for a distant investor to see or to check. A pitch alone asks the investor to take the founder's word for it.</p><p style="margin:0;font-size:18px;color:#344054">IkonetU puts the evidence beside the pitch and says plainly what has and has not been reviewed. Founders get a clear picture of what to build next. Investors spend their time on founders they can check.</p></div></div></section><section aria-labelledby="a-not" class="sec-t soft"><div class="wrap sec g12" style="row-gap:40px;align-items:start"><div class="c5"><h2 id="a-not" class="h2">What IkonetU is not</h2></div><div class="c7"><ul class="list"><li><span class="ico-n"><svg class="lucide lucide-x" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span>Not a competition. There are no rounds, rankings or winners.</span></li><li><span class="ico-n"><svg class="lucide lucide-x" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span>Not an accelerator. IkonetU takes no equity and runs no programme.</span></li><li><span class="ico-n"><svg class="lucide lucide-x" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span>Not a fundraising marketplace. No money moves through IkonetU.</span></li><li><span class="ico-n"><svg class="lucide lucide-x" aria-hidden="true" width="20" height="20" v
