</p></details><details><summary>What does it cost?<span class="plus" style="display:inline-flex;color:var(--text-2)"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>Founder Free costs nothing and covers your profile, your pitch and introductions. Founder Premium costs $5 a month and adds verification of your evidence. Premium is not on sale yet. It opens once IkonetU can take payments, and nobody is charged today. The <a href="/pricing">pricing page</a> lists what each plan includes.</p></details><details><summary>What counts as evidence?<span class="plus" style="display:inline-flex;color:var(--text-2)"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>Anything that shows progress and can be checked counts, such as product links, usage figures, bank statements, customer references, company registration and team details.</p></details><details><summary>Can I delete my profile?<span class="plus" style="display:inline-flex;color:var(--text-2)"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>You can edit your venture's details, hide your profile from investors at any time, and replace or remove your pitch. To delete your account and its data, write to privacy@ikonetu.com. IkonetU may keep some information where the law, security, fraud prevention or a dispute requires it. Account data is kept for one year after the account closes, and profile and pitch data for one year after the profile is deleted.</p></details></div></div></section><section aria-labelledby="f-cta" class="sec-t cta-f"><div class="wrap sec intro-c"><h2 id="f-cta" class="h2">Start with your pitch today.</h2><p class="lede">Student founders aged 18 or over can join free, from any country.</p><div class="acts"><a class="btn btn-f btn-lg" href="/signin" data-on="click:chooseFounder">Create founder profile</a></div></div></section></main><footer class="site-ftr"><div class="wrap ftr-top"><div class="ftr-brand"> <a class="ftr-logo" href="/" aria-label="IkonetU home"><svg aria-hidden="true" width="148.5" height="34" viewBox="0 0 148.51 34.00" style="display:block;flex:none"><g transform="translate(-7.286 -2.429) scale(0.8095)"><path d="M9 4.5 Q9 3 10.5 3 L37.5 3 Q39 3 39 4.5 L39 10.5 Q39 12 37.5 12 L34.5 12 Q33 12 33 13.5 L33 28.5 Q33 30 31.5 30 L28.5 30 Q27 30 27 28.5 L27 13.5 Q27 12 25.5 12 L10.5 12 Q9 12 9 10.5 Z" fill="#FFFFFF"></path><path d="M39 43.5 Q39 45 37.5 45 L10.5 45 Q9 45 9 43.5 L9 37.5 Q9 36 10.5 36 L13.5 36 Q15 36 15 34.5 L15 19.5 Q15 18 16.5 18 L19.5 18 Q21 18 21 19.5 L21 34.5 Q21 36 22.5 36 L37.5 36 Q39 36 39 37.5 Z" fill="#F26B1D"></path></g><g transform="translate(33.651 8.053) scale(0.02402)"><path d="M72 745V0H208V745Z M426.0 745V0H562.0V388L525.0 375L842.0 0H1013.0L716.0 352L724.0 256L1022.0 745H862.0L662.0 417L562.0 536V745Z M1527.0 757Q1445.0 757 1374.0 728.0Q1303.0 699 1250.0 647.0Q1197.0 595 1167.5 524.5Q1138.0 454 1138.0 372Q1138.0 289 1167.0 219.0Q1196.0 149 1249.0 97.0Q1302.0 45 1373.0 16.5Q1444.0 -12 1527.0 -12Q1610.0 -12 1681.0 17.0Q1752.0 46 1805.0 97.5Q1858.0 149 1887.5 219.0Q1917.0 289 1917.0 372Q1917.0 454 1887.0 524.5Q1857.0 595 1804.0 647.0Q1751.0 699 1680.5 728.0Q1610.0 757 1527.0 757ZM1527.0 633Q1582.0 633 1628.0 613.5Q1674.0 594 1708.5 559.0Q1743.0 524 1761.5 476.0Q1780.0 428 1780.0 372Q1780.0 316 1761.5 268.5Q1743.0 221 1708.5
