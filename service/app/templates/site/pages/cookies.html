cookie and every item of browser storage that the IkonetU website and app use. A cookie is a small file that a website stores in your browser. Local storage is a similar store on your device that a website's scripts can read.</p><p>IkonetU uses no analytics, advertising or tracking cookies. The website serves its own fonts, so no font request goes to another company.</p></div></section><section aria-labelledby="cp-2" class="sec-t soft"><div class="wrap sec narrow doc"><h2 id="cp-2" class="doc-h2">Everything we store on your device</h2><p>Each item below comes from the IkonetU code or from a check of what Supabase's storage sends back.</p><div class="scroll" style="margin-bottom:16px"><table class="tbl" style="min-width:760px"><thead><tr><th style="width:17%">Name</th><th style="width:17%">Type</th><th>What it does</th><th style="width:24%">How long it lasts</th></tr></thead><tbody><tr><td>ik_access</td><td>A cookie that IkonetU sets</td><td>It holds the sign-in token that tells the app who you are. Scripts on the page cannot read it.</td><td>Up to 400 days. The token inside it lasts one hour, and the app renews it. Signing out removes the cookie.</td></tr><tr><td>ik_refresh</td><td>A cookie that IkonetU sets</td><td>It holds the token that the app uses to renew your sign-in, so that you stay signed in. Scripts on the page cannot read it.</td><td>Up to 400 days. Signing out removes it.</td></tr><tr><td>ik_pending_sign_in</td><td>A cookie that IkonetU sets</td><td>It holds your email address between asking for a sign-in code and entering it, so that the address never appears in a web address. Your browser sends it only to the sign-in pages.</td><td>10 minutes. It is deleted once you sign in.</td></tr><tr><td>ik_pkce</td><td>A cookie that IkonetU sets</td><td>It holds a one-time secret that ties a sign-in link to the browser that asked for it, so that only that browser can complete the sign-in.</td><td>10 minutes. It is deleted once the link is used.</td></tr><tr><td>ik_flash</td><td>A cookie that IkonetU sets</td><td>It holds a one-time message for the next page, such as “Your pitch is saved.”</td><td>60 seconds. It is deleted when the next page shows the message.</td></tr><tr><td>__cf_bm</td><td>A cookie that Cloudflare sets for Supabase</td><td>Supabase stores pitches and evidence files behind Cloudflare. When your browser loads a pitch video or a document, Cloudflare sets this cookie to tell people apart from automated traffic. It is set on supabase.co, not on IkonetU.</td><td>30 minutes.</td></tr><tr><td>ikonetu-side</td><td>Local storage on your device</td><td>It remembers whether you chose the founder path or the investor path, so that those links come first. It never leaves your browser.</td><td>Until you choose “Forget my choice” on the home page or clear your browser's storage.</td></tr></tbody></table></div></div></section><section aria-labelledby="cp-3" class="sec-t"><div class="wrap sec narrow doc"><h2 id="cp-3" class="doc-h2">Why we do not ask for consent</h2><p>The law allows a website to store an item without consent when the item is strictly necessary to provide a service that you ask for. The five IkonetU cookies sign you in, keep you signed in and carry the result of a form, and Cloudflare's cookie protects the storage that holds pitches and documents, so each of them is strictly necessary. The local storage item remembers only a choice that you made on the page, and you can remove it at any time.</p><h2 id="cp-4" class="doc-h2">Your choices</h2><p>You can delete cookies and local storage in your browser's settings, and you can tell your browser to block them. If you block the IkonetU cookies, you cannot sign in. If you block Cloudflare's cookie on supabase.co, pitches and documents may not load.</p><h2 id="cp-5" class="doc-h2">Changes</h2><p>We post each new version of this policy here with its date. The <a href="/privacy">privacy policy</a> explains how we use personal data.</p></div></section></main><footer
