oc-h2">How IkonetU uses cookies</h2><dl class="kv" style="margin-bottom:24px"><dt style="color:#475467">Operator</dt><dd style="margin:0;font-weight:600">IkonetU Technology Limited</dd><dt style="color:#475467">Contact</dt><dd style="margin:0"><a href="mailto:privacy@ikonetu.com" style="font-weight:600">privacy@ikonetu.com</a></dd></dl><p><strong>What cookies are.</strong> Cookies are small files stored on your device. We also use similar technologies such as local storage and pixels.</p><p><strong>Cookies we use.</strong> Strictly necessary cookies keep you signed in and support security: a session cookie set by IkonetU's sign-in provider, and a short-lived cookie that holds your email address while you complete sign-in. A preference item in your browser's local storage remembers whether you chose the founder path or the investor path. IkonetU does not use analytics or marketing cookies.</p><p><strong>Your choices.</strong> You can clear cookies and local storage in your browser settings. Blocking strictly necessary cookies may prevent parts of the Platform from working.</p><p><strong>Remembered path.</strong> If you choose the founder path or the investor path, for example with Create founder profile or Explore as an investor, we may store this preference on your device to put your path first. You can clear this preference using the "Forget my choice" link or your browser settings.</p></div></section><section aria-labelledby="l-now" class="sec-t soft"><div class="wrap sec narrow doc"><h2 id="l-now" class="doc-h2">What is stored on your device</h2><p>Each item below comes from the IkonetU website and app code.</p><div class="scroll"><table class="tbl" style="min-width:640px"><thead><tr><th style="width:28%">Item</th><th>What it does</th><th style="width:24%">How long</th></tr></thead><tbody><tr><td>Sign-in session cookie, set by Supabase</td><td>Keeps a person signed in. The app confirms it with Supabase, so a forged cookie is refused.</td><td>Up to 400 days, the default of the Supabase library the app uses. Signing out removes it.</td></tr><tr><td>ik_pending_sign_in</td><td>Holds the email address or phone number between asking for a code and entering it, so the address never appears in a web address. It is HTTP-only and sent only to the sign-in pages.</td><td>10 minutes, and deleted once sign-in succeeds</td></tr><tr><td>ikonetu-side, in local storage</td><td>Remembers whether the visitor chose the founder or the investor path, so those links come first. "Forget my choice" on the homepage removes it.</td><td>Until the visitor removes it or clears the browser</td></tr></tbody></table></div><p style="margin:16px 0 0">The website serves its own fonts, so no font request goes to another company.</p></div></section></main><footer class="site-ftr"><div class="wrap ftr-top"><div class="ftr-brand"> <a class="ftr-logo" href="/" aria-label="IkonetU home"><svg aria-hidden="true" width="148.5" height="34" viewBox="0 0 148.51 34.00" style="display:block;flex:none"><g transform="translate(-7.286 -2.429) scale(0.8095)"><path d="M9 4.5 Q9 3 10.5 3 L37.5 3 Q39 3 39 4.5 L39 10.5 Q39 12 37.5 12 L34.5 12 Q33 12 33 13.5 L33 28.5 Q33 30 31.5 30 L28.5 30 Q27 30 27 28.5 L27 13.5 Q27 12 25.5 12 L10.5 12 Q9 12 9 10.5 Z" fill="#FFFFFF"></path><path d="M39 43.5 Q39 45 37.5 45 L10.5 45 Q9 45 9 43.5 L9 37.5 Q9 36 10.5 36 L13.5 36 Q15 36 15 34.5 L15 19.5 Q15 18 16.5 18 L19.5 18 Q21 18 21 19.5 L21 34.5 Q21 36 22.5 36 L37.5 36 Q39 36 39 37.5 Z" fill="#F26B1D"></path></g><g transform="translate(33.651 8.053) scale(0.02402)"><path d="M72 745V0H208V745Z M426.0 745V0H562.0V388L525.0 375L842.0 0H1013.0L716.0 352L724.0 256L1022.0 745H862.0L662.0 417L562.0 536V745Z M1527.0 757Q1445.0 757 1374.0 728.0Q1303.0 699 1250.0 647.0Q1197.0 595 1167.5 524.5Q1138.0 454 1138.0 372Q1138.0 289 1167.0 219.0Q1196.0 149 1249.0 97.0Q1302.0 45 1373.0 16.5Q1444.0 -12 1527.0 -12Q1610.0 -12 1681.0 17.0Q1752.0 46 1805.0 97.5Q1858.0 149 1887.5 219.0Q1917.0 289 1917.0 372Q1917.0 454 1887
