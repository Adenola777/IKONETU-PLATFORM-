/path></svg>Platform reviewed</span></dt><dd>An IkonetU reviewer compared it with its source.</dd><dt><span class="chip chip-io"><svg class="lucide lucide-link" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Third-party evidence available</span></dt><dd>An outside source, such as a registry or a customer, backs it.</dd></dl><p class="small" style="margin:12px 0 0">A status describes one piece of evidence. It is not an assessment, an endorsement or an audit of the company.</p><template data-end></template></div></div></div><p class="small" style="margin:16px 0 0;font-size:13px">Sample profile. The founder, the company and the figures are illustrative.</p></div></section><section aria-labelledby="steps-title" class="sec-t soft"><div class="wrap sec"><div class="g12 walkrow"><div class="c5"><h2 id="steps-title" class="h2">From pitch to introduction</h2><p class="lede" style="margin-bottom:24px">Four stages, the same for every founder. Nobody competes, and no founder's progress changes another founder's profile.</p><p class="body2" style="margin-bottom:16px">The walkthrough shows the website with sample founders and figures. It has no sound and never plays by itself.</p> <a class="tlink" href="/how-it-works">Read how it works<svg class="lucide lucide-arrow-right" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a> </div><div class="c7"><video id="walk-video" class="walkvid" poster="/media/walkthrough-poster.jpg" preload="none" aria-label="Walkthrough of the IkonetU website" aria-describedby="walk-note" data-ref="walkVideoRef"><source src="/media/walkthrough.webm" type="video/webm"><source src="/media/walkthrough.mp4" type="video/mp4"></video><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:12px"><p id="walk-note" class="small" style="margin:0">How IkonetU works · <ik-t data-t="walkLength">1:24</ik-t> · No sound · Captions can be switched off in the player's menu.</p> <button type="button" class="ctrl" aria-expanded="false" aria-controls="walk-transcript" data-a="{&quot;aria-expanded&quot;: &quot;{{walkTranscriptOpen}}&quot;}" data-on="click:toggleWalkTranscript"><svg class="lucide lucide-file-text" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>Transcript</button> </div><div id="walk-transcript"><template data-if="walkTranscriptOpen"><ol style="list-style:none;margin:16px 0 0;padding:16px;border-radius:12px;background:#FFFFFF;border:1px solid #E7EAF0;display:flex;flex-direction:column;gap:8px;font-size:15px"><template data-for="walkLines" data-as="l"><li style="display:flex;gap:12px"><span style="flex:0 0 40px;color:#475467;font-variant-numeric:tabular-nums" data-t="l.at"></span><span style="min-width:0" data-t="l.text"></span></li></template><template data-end></template></ol></template><template data-end></template></div></div></div><ol class="g12 steps"><li class="c6 card stepcard"><div class="shotwell"><img src="/media/screen-pitch.webp" width="1120" height="700" loading="lazy" decoding="async" alt="The pitch player on a sample founder profile in the IkonetU app, paused at one second with the caption: I&#x27;m Amara Okafor, founder of Market Day Pay."></div><div class="stephead"><span class="num">1</span><h3 class="h3">One-minute pitch</h3></div><p class="body2">The founder explains what they are building and why now, with captions.</p></li><li class="c6 card stepcard"><div class="shotwell"><img src="/media/screen-evidence.webp" width="1120" height="700" loading="lazy" decoding="async" alt="Evidence on a sample founder profile in the IkonetU app. The revenue evidence of Market Day Pay is Platform reviewed and says what the reviewer compared on 3 October 2026."></div><div class="stephead"><span class="num">2</span><h3 class="h3">Evidence</h3></div><p class="body2">Each piece of evidence shows who supplied it and whether IkonetU reviewed it.</p></li><li class="c6 card stepcard"><div class="shotwell"><img src="/media/screen-readiness.webp" width="1120" height="700" loading="lazy" decoding="async" alt="The readiness check on a sample founder&#x27;s dashboard in the IkonetU app. Four areas are Strong, three are Building, and Operations is a Gap."></div><div class="stephead"><span class="num">3</span><h3 class="h3">Readiness check</h3></div><p class="body2">Eight areas show where the evidence is strong and where it is thin.</p></li><li class="c6 card stepcard"><div class="shotwell"><img src="/media/screen-intro.webp" width="1120" height="700" loading="lazy" decoding="async" alt="An accepted introduction in the IkonetU app between a sample investor and the sample founder of Chama Books, with the investor&#x27;s note and two replies."></div><div class="stephead"><span class="num">4</span><h3 class="h3">Introduction</h3></div><p class="body2">An investor requests an introduction, and the founder accepts or declines.</p></li></ol><p class="small" style="margin:24px 0 0">The pictures are screens from the IkonetU app. The founders, companies and figures in them are samples.</p></div></section><section aria-labelledby="does-title" class="sec-t"><div class="wrap sec"><h2 id="does-title" class="h2">What IkonetU does, and does not do.</h2><p class="lede" style="margin-bottom:40px">Founders and investors should know exactly what they can rely on.</p><div class="does"><div class="card" style="padding:28px"><p class="lbl" style="margin-bottom:8px">IkonetU does</p><ul class="list"><li><span class="ico-b"><svg class="lucide lucide-check" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Help founders present their progress</span></li><li><span class="ico-b"><svg class="lucide lucide-check" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Let founders control what their profile shows</span></li><li><span class="ico-b"><svg class="lucide lucide-check" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Help investors find relevant founders</span></li><li><span class="ico-b"><svg class="lucide lucide-check" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Make introductions that both sides agree to</span></li><li><span class="ico-b"><svg class="lucide lucide-check" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Show evidence, its review status and recent momentum</span></li></ul></div><div class="card" style="padding:28px"><p class="lbl" style="margin-bottom:8px">IkonetU does not</p><ul class="list"><li><span class="ico-n"><svg class="lucide lucide-x" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span>Guarantee funding</span></li><li><span class="ico-n"><svg class="lucide lucide-x" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span>Provide investment advice</span></li><li><span class="ico-n"><svg class="lucide lucide-x" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span>Endorse or approve companies</span></li><li><span class="ico-n"><svg class="lucide lucide-x" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span>Make investment decisions</span></li><li><span class="ico-n"><svg class="lucide lucide-x" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span>Replace an investor's own diligence</span></li></ul></div></div><p style="margin:32px 0 0"><a class="tlink" href="/trust-and-safety">Read about trust and safety<svg class="lucide lucide-arrow-right" aria-hidden="true" width="18" height="18" viewBox
