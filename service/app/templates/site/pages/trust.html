late data-if="investorFirst"><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a></template><template data-end></template> </div></div></header> <main id="main"><section aria-labelledby="t-title" class="hero-c hero-solo"><div class="wrap"><p class="lbl">Trust and safety</p><h1 id="t-title" class="h1">How IkonetU verifies evidence and protects your data.</h1><nav aria-label="On this page" class="toc"> <a class="tlink" href="#t-does">What IkonetU does</a> <a class="tlink" href="#t-review">How verification works</a> <a class="tlink" href="#t-ready">The readiness check</a> <a class="tlink" href="#t-score">The IkonetU Score</a> <a class="tlink" href="#t-data">Your data and what others see</a> <a class="tlink" href="#t-intro">Introductions</a> <a class="tlink" href="#t-risk">Investment risk</a> <a class="tlink" href="#t-report">Raise a concern</a> </nav></div></section><section aria-labelledby="t-does" class="sec-t"><div class="wrap sec read doc"><h2 id="t-does" class="doc-h2">What IkonetU does</h2><ul class="rows"><li>Founders present their progress with a one-minute pitch and evidence.</li><li>Founders control what their profile shows, and they can hide it at any time.</li><li>Investors find founders by sector, stage, country and evidence.</li><li>A conversation opens only when the founder accepts an introduction.</li><li>Each piece of evidence shows its status, and each profile shows recent activity.</li></ul></div></section><section aria-labelledby="t-review" class="sec-t soft"><div class="wrap sec read doc"><h2 id="t-review" class="doc-h2">How verification works</h2><p class="doc-lead">Every piece of evidence carries one of three statuses. A status describes that piece of evidence on the date shown, and the decision to invest stays with the investor.</p><p>Verification is part of Premium. Founder Premium, at $5 a month, verifies a founder's evidence, and Investor Premium, at $29 a month, shows its details. Premium is not on sale yet. It opens once IkonetU can take payments, and nobody is charged today.</p><table class="tbl legend-tbl" role="table"><thead role="rowgroup"><tr role="row"><th scope="col" role="columnheader">Status</th><th scope="col" role="columnheader">What it means</th></tr></thead><tbody role="rowgroup"><tr role="row"><td role="cell"><span class="chip chip-n"><svg class="lucide lucide-upload" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3v12"></path><path d="m17 8-5-5-5 5"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path></svg>Founder submitted</span></td><td role="cell">The founder added this evidence, and IkonetU has not verified it.</td></tr><tr role="row"><td role="cell"><span class="chip chip-ok"><svg class="lucide lucide-shield-check" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>Platform reviewed</span></td><td role="cell">IkonetU compared the evidence with its source, such as bank statements, on the date shown.</td></tr><tr role="row"><td role="cell"><span class="chip chip-3p"><svg class="lucide lucide-link" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Third-party evidence available</span></td><td role="cell">An outside source backs the evidence, such as a company registry record or a customer reference.</td></tr></tbody></table></div></section><section aria-labelledby="t-ready" class="sec-t"><div class="wrap sec read doc"><h2 id="t-ready" class="doc-h2">The readiness check</h2><p>The IkonetU Readiness Check gives an indication from the information you provide, so that a founder can see what to add next. Every investment decision stays with the investor, and the <a href="/terms#terms-use">terms</a> explain how far the result can be relied on.</p></div></section><section aria-labelledby="t-score" class="sec-t soft"><div class="wrap sec read doc"><h2 id="t-score" class="doc-h2">The IkonetU Score</h2><p>The IkonetU Score is a number from 0 to 1,000 that IkonetU calculates from the evidence on a founder's profile. Investors do not see it. It shows a founder where they stand and which steps add the most points.</p></div></section><section aria-labelledby="t-data" class="sec-t"><div class="wrap sec read doc"><h2 id="t-data" class="doc-h2">Your data and what others see</h2><p class="doc-lead">Founders decide what goes on their profile, and the documents they upload stay private.</p><ul class="rows"><li>Investors see the pitch, the profile details, evidence summaries and their statuses.</li><li>Investors do not see the documents behind the evidence, or a founder's email address and phone number.</li><li>Only IkonetU staff can open the documents, through links that last five minutes.</li></ul></div></section><section aria-labelledby="t-intro" class="sec-t soft"><div class="wrap sec read doc"><h2 id="t-intro" class="doc-h2">Introductions</h2><ul class="rows"><li>Every introduction is requested on IkonetU, with a short note saying why.</li><li>Both sides agree before a conversation opens. A founder can decline without giving a reason.</li><li>Either side can report a conversation to IkonetU from the conversation page.</li></ul><p>An introduction commits neither side to invest, to raise money or to keep talking. Every investment decision belongs to the investor and the founder concerned.</p></div></section><section aria-labelledby="t-risk" class="sec-t"><div class="wrap sec read doc"><h2 id="t-risk" class="doc-h2">Investment risk</h2><p class="risk-box">Investing in early-stage businesses is high risk. You could lose all the money you invest, and you are unlikely to be able to sell your shares quickly.</p><p>IkonetU is not authorised by the Financial Conduct Authority. It does not give investment advice, recommend any founder or arrange investments, and every investment decision belongs to the investor. Read the <a href="/terms#risk">investment risk warning</a> before you invest.</p></div></section><section aria-labelledby="t-report" class="sec-t soft"><div class="wrap sec read doc"><h2 id="t-report" class="doc-h2">Raise a concern</h2><p class="doc-lead">If something on IkonetU looks wrong, misleading or unsafe, tell us.</p><p>Email <a href="mailto:info@ikonetu.com" style="font-weight:600">info@ikonetu.com</a>. For a question about personal data, email <a href="mailto:privacy@ikonetu.com" style="font-weight:600">privacy@ikonetu.com</a>. The <a href="/complaints">reporting and complaints policy</a> explains what happens next and how to ask us to review a decision.</p><nav aria-label="Legal pages" class="toc doc-links"> <a class="tlink" href="/privacy">Privacy</a> <a class="tlink" href="/terms">Terms</a> <a class="tlink" href="/cookies">Cookies</a> <a class="tlink" href="/complaints">Reporting and complaints</a> </nav></div></section></main><footer class="site-ftr"><div class="wrap ftr-top"><div class="ftr-brand"> <a class="ftr-logo" href="/" aria-label="IkonetU home"><svg aria-hidden="true" width="148.5" height="34" viewBox="0 0 148.51 34.00" style="display:block;flex:none"><g transform="translate(-7.286 -2.429) scale(0.8095)"><path d="M9 4.5 Q9 3 10.5 3 L37.5 3 Q39 3 39 4.5 L39 10.5 Q39 12 37.5
