th d="M20 6 9 17l-5-5"></path></svg></span><span>Founders present their progress with a one-minute pitch and evidence.</span></li><li><span class="ico-b"><svg class="lucide lucide-check" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Founders control what their profile shows, and they can hide it at any time.</span></li><li><span class="ico-b"><svg class="lucide lucide-check" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Investors find founders by sector, stage, country and evidence.</span></li><li><span class="ico-b"><svg class="lucide lucide-check" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg></span><span>A conversation opens only when the founder accepts an introduction.</span></li><li><span class="ico-b"><svg class="lucide lucide-check" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Each piece of evidence shows its status, and each profile shows recent activity.</span></li></ul></div></section><section aria-labelledby="t-review" class="sec-t soft"><div class="wrap sec g12" style="row-gap:40px;align-items:start"><div class="c5"><h2 id="t-review" class="h2">How verification works</h2><p class="lede">Every piece of evidence carries one of three statuses. A status describes that piece of evidence on the date shown, and the decision to invest stays with the investor.</p><p class="body2" style="margin:16px 0 0;font-size:17px">Verification is part of Premium. Founder Premium, at $5 a month, verifies a founder's evidence, and Investor Premium, at $29 a month, shows its details. Premium is not on sale yet. It opens once IkonetU can take payments, and nobody is charged today.</p></div><div class="c7"><ul class="list list-chip"><li><span class="chip chip-n" style="flex:none;align-self:flex-start"><svg class="lucide lucide-upload" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3v12"></path><path d="m17 8-5-5-5 5"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path></svg>Founder submitted</span><span>The founder added this evidence, and IkonetU has not verified it.</span></li><li><span class="chip chip-ok" style="flex:none;align-self:flex-start"><svg class="lucide lucide-shield-check" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>Platform reviewed</span><span>IkonetU compared the evidence with its source, such as bank statements, on the date shown.</span></li><li><span class="chip chip-3p" style="flex:none;align-self:flex-start"><svg class="lucide lucide-link" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Third-party evidence available</span><span>An outside source backs the evidence, such as a company registry record or a customer reference.</span></li></ul></div></div></section><section aria-labelledby="t-ready" class="sec-t"><div class="wrap sec g12" style="row-gap:40px;align-items:start"><div class="c5"><h2 id="t-ready" class="h2">The readiness check</h2></div><div class="c7"><p class="body2" style="font-size:17px">The IkonetU Readiness Check gives an indication from the information you provide, so that a founder can see what to add next. Every investment decision stays with the investor, and the <a href="/terms#terms-use">terms</a> explain how far the result can be relied on.</p></div></div></section><section aria-labelledby="t-score" class="sec-t"><div class="wrap sec g12" style="row-gap:40px;align-items:start"><div class="c5"><h2 id="t-score" class="h2">The IkonetU Score</h2></div><div class="c7"><p class="body2" style="font-size:17px">The IkonetU Score is a number from 0 to 1,000 that IkonetU calculates from the evidence on a founder's profile. Investors do not see it. It shows a founder where they stand and which steps add the most points.</p></div></div></section><section aria-labelledby="t-data" class="sec-t soft"><div class="wrap sec g12" style="row-gap:40px;align-items:start"><div class="c5"><h2 id="t-data" class="h2">Your data and what others see</h2><p class="lede">Founders decide what goes on their profile, and the documents they upload stay private.</p></div><div class="c7"><ul class="list"><li><span class="ico-b"><svg class="lucide lucide-eye" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></span><span>Investors see the pitch, the profile details, evidence summaries and their statuses.</span></li>
