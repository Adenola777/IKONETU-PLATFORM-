or" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3v12"></path><path d="m17 8-5-5-5 5"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path></svg>Founder submitted</span><p style="margin:16px 0 8px;font-weight:600">The founder added it.</p><p class="body2" style="font-size:15px">IkonetU has not verified it yet.</p></div><div class="card"><span class="chip chip-i"><svg class="lucide lucide-shield-check" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>Platform reviewed</span><p style="margin:16px 0 8px;font-weight:600">IkonetU verified it against its source.</p><p class="body2" style="font-size:15px">The profile says what was compared and when.</p></div><div class="card"><span class="chip chip-io"><svg class="lucide lucide-link" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Third-party evidence available</span><p style="margin:16px 0 8px;font-weight:600">A registry record or a customer reference backs it.</p></div></div><p style="margin:32px 0 0;max-width:760px;color:#344054">A label records what was verified and when. Your own diligence decides whether you invest.</p></div></section><section aria-labelledby="intro-title" class="sec-t"><div class="wrap sec"><h2 id="intro-title" class="h2">Ask for an introduction.</h2><p class="lede" style="margin:0">Send a short note on why you want to talk. If the founder accepts, a conversation opens on IkonetU.</p></div></section><section aria-labelledby="inv-faq" class="sec-t soft"><div class="wrap sec narrow faq"><h2 id="inv-faq" class="h2" style="margin-bottom:24px">Questions investors ask</h2><details><summary>Who can join?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>Investors aged 18 or over can join from any country.</p></details><details><summary>What does it cost?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>Investor Free costs nothing and covers search, pitches and introductions. Investor Premium costs $29 a month and adds verification details and the full profiles of verified founders. Premium is not on sale yet. It opens once IkonetU can take payments, and nobody is charged today. The <a href="/pricing">pricing page</a> lists what each plan includes.</p></details><details><summary>What do investors see?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>With Investor Free, you see the one-minute pitch, the profile details and the founder's ask, the readiness check, the status of each piece of evidence and recent activity. Investor Premium adds what IkonetU compared, the founder's evidence summaries and the full profiles of verified founders. They never see the documents a founder uploads as evidence, and they do not see the founder's IkonetU Score.</p></details></div></section><section aria-labelledby="cta-title" style="border-top:2px solid #123C7A"><div class="wrap sec"><h2 id="cta-title" class="h2">Create your investor account.</h2><p class="lede" style="margin-bottom:32px">Tell us what you invest in. Once an IkonetU admin approves your account, you can browse founders and request introductions.</p> <a class="btn btn-i btn-lg" href="/signin" data-on="click:chooseInvestor">Create an investor account</a> <p class="small" style="margin:40px 0 0;max-width:760px">Investing in early-stage businesses is high risk, and you could lose all the money you invest. Read the <a href="/terms#risk">investment risk warning</a> before you invest.</p></div></section></main><footer class="site-ftr"><div class="wrap ftr-top"><div class="ftr-brand"> <a class="ftr-logo" href="/" aria-label="IkonetU home"><svg aria-hidden="true" width="148.5" height="34" viewBox="0 0 148.51 34.00" style="display:block;flex:none"><g transform="translate(-7.286 -2.429) scale(0.8095)"><path d="M9 4.5 Q9 3 10.5 3 L37.5 3 Q39 3 39 4.5 L39 10.5 Q39 12 37.5 12 L34.5 12 Q33 12 33 13.5 L33 28.5 Q33 30 31.5 30 L28.5 30 Q27 30 27 28.5 L27 13.5 Q27 12 25.5 12 L10.5 12 Q9 12 9 10.5 Z" fill="#FFFFFF"></path><path d="M39 43.5 Q39 45 37.5 45 L10.5 45 Q9 45 9 43.5 L9 37.5 Q9 36 10.5 36 L13.5 36 Q15 36 15 34.5 L15 19.5 Q15 18 16.5 18 L19.5 18 Q21 18 21 19.5 L21 34.5 Q21 36 22.5 36 L37.5 36 Q39 36 39 37.5 Z" fill="#F26B1D"></path></g><g transform="translate(33.651 8.053) scale(0.02402)"><path d="M72 745V0H208V745Z M426.0 745V0H562.0V388L525.0 375L842.0 0H1013.0L716.0 352L724.0 256L1022.0 745H862.0L662.0 417L562.0 536V745Z M1527.0 757Q1445.0 757 1374.0 728.0Q1303.0 699 1250.0 647.0Q1197.0 595 1167.5 524.5Q1138.0 454 1138.0 372
