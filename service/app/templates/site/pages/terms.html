11H3404.0V431H3065.0V625H3424.0V745Z M3725.0 745V120H3532.0V0H4052.0V120H3862.0V745Z M4487.0 757Q4401.0 757 4334.5 721.0Q4268.0 685 4230.0 622.0Q4192.0 559 4192.0 479V0H4328.0V472Q4328.0 518 4348.5 555.0Q4369.0 592 4405.0 612.5Q4441.0 633 4487.0 633Q4534.0 633 4569.5 612.5Q4605.0 592 4625.5 555.0Q4646.0 518 4646.0 472V0H4782.0V479Q4782.0 559 4744.0 622.0Q4706.0 685 4639.5 721.0Q4573.0 757 4487.0 757Z" fill="#123C7A"></path></g></svg></a> <button type="button" class="menubtn" aria-expanded="false" aria-controls="site-nav site-ctas" data-a="{&quot;aria-expanded&quot;: &quot;{{menuOpen}}&quot;}" data-on="click:toggleMenu" data-ref="menuRef"><template data-if="menuOpen"><svg class="lucide lucide-x" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></template><template data-end></template><template data-if="menuClosed"><svg class="lucide lucide-menu" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg></template><svg class="lucide lucide-menu" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg><template data-end></template>Menu</button> <nav id="site-nav" aria-label="Main" class="hdr-nav " data-a="{&quot;class&quot;: &quot;hdr-nav {{navClass}}&quot;}"> <a class="navlink" href="/for-founders" data-a="{&quot;aria-current&quot;: &quot;{{cur.founders}}&quot;}">For founders</a> <a class="navlink" href="/for-investors" data-a="{&quot;aria-current&quot;: &quot;{{cur.investors}}&quot;}">For investors</a> <a class="navlink" href="/trust-and-safety" data-a="{&quot;aria-current&quot;: &quot;{{cur.trust}}&quot;}">Trust and safety</a> <a class="navlink" href="/pricing" data-a="{&quot;aria-current&quot;: &quot;{{cur.pricing}}&quot;}">Pricing</a> <a class="navlink" href="/signin" data-a="{&quot;aria-current&quot;: &quot;{{cur.signin}}&quot;}">Sign in</a> </nav><div id="site-ctas" class="hdr-ctas " data-a="{&quot;class&quot;: &quot;hdr-ctas {{navClass}}&quot;}"> <template data-if="founderFirst"><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a></template><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a><template data-end></template> <template data-if="investorFirst"><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a></template><template data-end></template> </div></div></header> <main id="main"><section aria-labelledby="l-title"><div class="wrap narrow" style="padding-top:88px;padding-bottom:40px"><p class="lbl" style="margin-bottom:20px">Legal</p><h1 id="l-title" class="h1">Terms</h1><p class="small" style="margin:0 0 24px">This version is dated 21 October 2026 and replaces the version of 15 October 2026. Questions about these terms go to <a href="mailto:legal@ikonetu.com">legal@ikonetu.com</a>.</p><nav aria-label="Legal pages" class="legalnav"><a href="/privacy">Privacy policy</a><a href="/terms" aria-current="page">Terms</a><a href="/cookies">Cookie policy</a><a href="/complaints">Reporting and complaints</a></nav><nav aria-label="On this page" class="toc" style="margin-top:16px"> <a class="tlink" href="#terms-use">Terms of use</a> <a class="tlink" href="#terms-founder">Founder terms</a> <a class="tlink" href="#terms-investor">Investor terms</a> <a class="tlink" href="#terms-aup">Acceptable use policy</a> <a class="tlink" href="#risk">Investment risk warning</a> </nav></div></section><section aria-labelledby="terms-use" class="sec-t"><div class="wrap sec narrow doc"><h2 id="terms-use" class="doc-h2">Terms of use</h2><p><strong>1. These terms.</strong> These terms are an agreement between you and IkonetU Technology Limited. They apply to everyone who uses the IkonetU website or app. If you create a founder profile, the founder terms also apply to you. If you create an investor account, the investor terms also apply to you. The acceptable use policy below and the <a href="/complaints">reporting and complaints policy</a> form part of these terms. The <a href="/privacy">privacy policy</a> and the <a href="/cookies">cookie policy</a> explain how we use personal data. By creating an account or using IkonetU, you accept these terms. If you do not accept them, please do not use IkonetU.</p><p><strong>2. Who we are.</strong> IkonetU Technology Limited is a company registered in England and Wales with company number 17110122. Its registered office is Maisonette 3, 23 Watkins Road, Leicester, United Kingdom. You can reach us at <a href="mailto:info@ikonetu.com">info@ikonetu.com</a>, and on legal matters at <a href="mailto:legal@ikonetu.com">legal@ikonetu.com</a>. In these terms, “IkonetU”, “we” and “us” mean that company, and “you” means the person who uses IkonetU.</p><p><strong>3. What IkonetU does.</strong> IkonetU lets founders of early-stage businesses in Nigeria, Ghana and Kenya present their business with a pitch and evidence. IkonetU reviewers check evidence against its source and give it a status. Approved investors can find founders and ask to be introduced, and a founder who accepts can talk with the investor on IkonetU.</p><p><strong>4. What IkonetU does not do.</strong> IkonetU is not authorised or regulated by the Financial Conduct Authority. We do not give investment, legal, tax or financial advice. We do not recommend, endorse or rank any founder, business or investment. We do not arrange, negotiate or complete investments, we do not hold money for anyone, and we do not act as agent for a founder or an investor. We do not promise that a founder will raise money or that an investment will succeed. Everything a founder says on IkonetU is the founder's own statement, and a review status does not turn it into a statement by us.</p><p><strong>5. Who may use IkonetU.</strong> You must be 18 or older. Founders must meet the founder terms, and investors must meet the investor terms. You may not use IkonetU if you are named on a UK sanctions list, if you are owned or controlled by such a person or act for one, or if your use of IkonetU would break a sanctions law that applies to you or to us.</p><p><strong>6. Your account.</strong> You sign in with a link or a code sent to your email address. Keep that email account secure, because anyone who controls it can sign in as you. Each account is for one person. You must give accurate details and keep them up to date. Tell us at once at <a href="mailto:info@ikonetu.com">info@ikonetu.com</a> if you think that someone else has used your account.</p><p><strong>7. Fees.</strong> Founder Free and Investor Free cost nothing. Founder Premium costs $5 a month and Investor Premium costs $29 a month, in US dollars, as the <a href="/pricing">pricing page</a> describes. Premium is not on sale yet, and nobody is charged today. Before you buy Premium, we will show you the price, how often it is charged, how it renews and how to cancel it, and we will not charge you for anything you have not agreed to.</p><p><strong>8. Your content and the licence you give us.</strong> You keep ownership of everything you add to IkonetU, including your pitch, documents, images, text and messages. You give us a non-exclusive, worldwide, royalty-free licence to store, copy, display and process your content in order to run IkonetU: to show it to the people that your settings and these terms allow, to review it, to calculate scores from it and to keep the records that the privacy policy describes. The licence ends for each item when it is deleted, except for copies in backups until they are overwritten, for messages already sent to another user, and for records we keep under the privacy policy. We use a founder's pitch, name or venture in our own marketing only if the founder agrees to that separately, as the founder terms explain.</p><p><strong>9. Your promises about your content.</strong> You promise that you own your content or have permission to add it, that every person who can be identified in it has agreed or that you have another lawful basis for including them, that it is accurate and not misleading, that it does not infringe anyone's rights or break a duty of confidence, and that it complies with the acceptable use policy.</p><p><strong>10. Review statuses, the readiness self-check and the IkonetU Score.</strong> A review status describes one piece of evidence on the date shown, and it means what the app says it means where it appears. It is not an audit, a check of a whole business or a promise that information is true. The readiness self-check and the IkonetU Score are guides for founders. Neither of them is a credit score, a valuation, an investment recommendation or a ranking, and neither predicts whether a founder will raise money. We may change the rules that the score uses, and a change can move a score.</p><p><strong>11. Information you receive about others.</strong> Information that you receive through IkonetU and that is not public belongs to the person who shared it. You may use it only for the purpose for which IkonetU makes it available, and you must keep it confidential. The investor terms set out the stricter rules that apply to investors.</p><p><strong>12. Personal data you receive.</strong> If you receive another user's personal data through IkonetU, such as a name in a profile or details in a message, you decide what you do with it from then on, and you are responsible for it under the data protection law that applies to you. Use it only to deal with that person about the matter in hand, keep it secure, and delete it when you no longer need it.</p><p><strong>13. Reporting and moderation.</strong> Anyone can report content or a user, as the reporting and complaints policy describes. We may remove or hide content, withdraw a review status, hide a profile from investors, decline or suspend an account, or close it, where we reasonably believe that the content or the account breaks these terms or the law, or puts someone at risk. We tell you what we did and why, unless the law or someone's safety prevents it, and you can ask us to review the decision.</p><p><strong>14. IkonetU's own rights.</strong> IkonetU's name, logo, design, text and software belong to us or to the people who license them to us. You may use IkonetU for its purpose. You may not copy, change or reuse any part of it for any other purpose without our written permission.</p><p><strong>15. Availability and changes to the service.</strong> We work to keep IkonetU available, but we cannot promise that it will always be available or free of errors. We may change or withdraw a feature. If a change takes away something that matters to you, we will tell you in advance where we can.</p><p><strong>16. Closing or suspending an account.</strong> You can close your account at any time by writing to <a href="mailto:privacy@ikonetu.com">privacy@ikonetu.com</a> from the email address on your account. We may suspend or close your account if you break these terms seriously or repeatedly, if the law requires it, or if your account puts other users or IkonetU at risk. We tell you the reason, unless the law, an investigation or someone's safety prevents it. If we close an account for any reason other than a breach of these terms, we give 30 days' notice. When an account closes, the privacy policy sets out what we keep and for how long. Sections 8, 11, 12, 17, 18, 21 and 22 continue to apply after an account closes.</p><p><strong>17. Our responsibility to you.</strong> Nothing in these terms limits our liability for death or personal injury caused by our negligence, for fraud, or for anything else that the law does not allow us to limit. We are not responsible for decisions that you make on the basis of information on IkonetU, for what other users say or do on IkonetU or after an introduction, for the outcome of any investment or fundraising, or for loss that was not reasonably foreseeable when you started to use IkonetU. If you use IkonetU for a business, we are not responsible for loss of profit, revenue, business or opportunity. In every other case, our total liability to you is limited to £100 or, if it is more, the total you paid us in the 12 months before the claim. If you are a consumer, you have legal rights that these terms do not affect.</p><p><strong>18. Your responsibility to us.</strong> If you use IkonetU for a business, you will compensate us for any loss, cost or claim that we suffer because you broke the acceptable use policy or because your content infringed another person's rights. We will tell you promptly of any such claim and let you take part in dealing with it.</p><p><strong>19. Changes to these terms.</strong> We may change these terms to reflect a change in the law, in our service or in how we work. We post each new version here with its date. If a change affects you materially, we will tell you by email or in the app at least 30 days before it takes effect, unless the law or a safety reason requires a faster change. If you do not accept a change, you can close your account before it takes effect.</p><p><strong>20. Complaints.</strong> Please tell us first if something goes wrong, by following the reporting and complaints policy, so that we can try to put it right. We ask that you give us 30 days to resolve a complaint before you start court proceedings.</p><p><strong>21. Law and courts.</strong> English law governs these terms. The courts of England and Wales can hear any dispute about them. If you are a consumer living in Scotland or Northern Ireland, you can also bring proceedings in your own courts. If you are a consumer living in another country, you keep any protection that its law gives you and that an agreement cannot exclude.</p><p><strong>22. General.</strong> These terms, with the documents they refer to, are the whole agreement between you and us about IkonetU. If a court finds part of them unenforceable, the rest continues to apply. If we do not enforce a right at once, we can still enforce it later. We may transfer our rights and duties under these terms to another organisation, and we will tell you if the transfer affects you. You may not transfer yours without our written agreement. No one other than you and us has any right to enforce these terms. We are not responsible for a delay or failure caused by events outside our reasonable control. We send notices to the email address on your account, and you can send notices to <a href="mailto:legal@ikonetu.com">legal@ikonetu.com</a>. These terms are written in English, and the English version applies.</p></div></section><section aria-labelledby="terms-founder" class="sec-t soft"><div class="wrap sec narrow doc"><h2 id="terms-founder" class="doc-h2">Founder terms</h2><p><strong>1. When these terms apply.</strong> These terms apply, with the terms of use, to anyone who creates a founder profile.</p><p><strong>2. Who may be a founder.</strong> You must be 18 or older, and you must be a founder, director, owner or authorised representative of the business you present. The business must be based in Nigeria, Ghana or Kenya. You confirm that you have authority to share its information and to speak with investors for it.</p><p><strong>3. Accuracy.</strong> Everything you add must be true, complete enough not to mislead, and up to date. You must not add forged, altered or borrowed documents, or evidence about another business. You must correct anything that changes or turns out to be wrong. If we find that evidence is false, we may withdraw its status, hide your profile, suspend or close your account, and report the matter to the police or another authority.</p><p><strong>4. Evidence review.</strong> When you add evidence, you ask us to review it. A reviewer compares it with its source, and then approves it with a status and a public note, or declines it with a reason. A reviewer may check a public register or another source that the evidence names. We decide how and when to review, and we may decline evidence that we cannot check. Some kinds of evidence lapse after a set period, and you must then add them again. We may check approved evidence again, and we may change or withdraw a status if we learn that it no longer holds.</p><p><strong>5. Your IkonetU Score.</strong> We calculate your score from your approved evidence and from the statements you make, using the rules that the app shows you. Only you and IkonetU staff see it. If you think that a status or your score is wrong, you can ask us to review it under the reporting and complaints policy.</p><p><strong>6. What investors see.</strong> When you publish your profile, approved investors can see your pitch, your profile details, the amount you are raising, the summaries and statuses of your evidence, and your updates. They cannot see your documents, your score, your email address or your phone number. You can hide your profile at any time, and investors then stop seeing it.</p><p><strong>7. Raising money.</strong> A profile that says what you are raising can be a financial promotion under the law of some countries, including the United Kingdom. You must not use IkonetU to offer shares or other investments to the public, to promise a return, or to say anything about an investment that is unclear, unfair or misleading. You are responsible for following the laws on raising money that apply to you and to the investors you speak with. IkonetU shows profiles to investors in the United Kingdom only on the conditions in the investor terms.</p><p><strong>8. Introductions.</strong> An approved investor can ask to be introduced, with a short note. You decide whether to accept, and you do not have to give a reason. Accepting opens a conversation on IkonetU and does not share your email address or phone number. Neither of you is bound to invest, to raise money or to keep talking.</p><p><strong>9. Other people in your profile and evidence.</strong> If you include information about other people, such as team members, customers, referees or a next of kin, you must tell them that you are sharing it with IkonetU and why, and point them to the privacy policy. Include only what your evidence needs. Cover other people's identity numbers, bank details and signatures, unless the evidence cannot be checked without them.</p><p><strong>10. Your pitch in our marketing.</strong> We will use your pitch, your name, your venture's name or its logo in IkonetU's own marketing only if you agree to that use in writing, for example by email. You can withdraw your agreement at any time by writing to <a href="mailto:info@ikonetu.com">info@ikonetu.com</a>. We will then make no new use of it, and we will remove it from material we control within 30 days. Material that others published before you withdrew may remain where we cannot reasonably remove it.</p><p><strong>11. Changing and removing content.</strong> You can edit your venture's details, replace or remove your pitch, post and remove updates, and publish or hide your profile in the app. To remove a piece of evidence or to close your account, write to <a href="mailto:privacy@ikonetu.com">privacy@ikonetu.com</a> from the email address on your account. Records that we keep under the privacy policy remain for the periods it sets.</p></div></section><section aria-labelledby="terms-investor" class="sec-t"><div class="wrap sec narrow doc"><h2 id="terms-investor" class="doc-h2">Investor terms</h2><p><strong>1. When these terms apply.</strong> These terms apply, with the terms of use, to anyone who creates an investor account.</p><p><strong>2. Who may be an investor.</strong> You must be 18 or older, and the law where you are must allow you to receive information about early-stage businesses and investments in them. An IkonetU admin checks each investor account before it can see founder profiles. We may decline an account, and we may ask you for information about yourself or your firm before or after we approve it.</p><p><strong>3. Investors in the United Kingdom.</strong> UK law restricts who may receive communications about investing in unlisted companies. If you are in the United Kingdom, we approve your account only after you give us one of the following. If you invest as an individual, you must give us a statement, signed in the form that the Financial Services and Markets Act 2000 (Financial Promotion) Order 2005 prescribes, that you are a certified high net worth individual under article 48 or a self-certified sophisticated investor under article 50A. If you invest for a firm, you must confirm in writing that the firm is an investment professional under article 19, or a high net worth company, partnership, association or trust under article 49, and give us the information we ask for to check it. Each statement sets out its conditions, and you must meet them on the date you sign. A statement lasts 12 months, and you must renew it before it lapses. You must tell us at once if you stop meeting its conditions. We may ask for evidence that you meet them. If you give a statement that is not true, we close your account.</p><p><strong>4. No advice, and your own checks.</strong> Nothing on IkonetU is advice or a recommendation to invest. Before you invest, make your own enquiries about the founder and the business, and take advice from a professional adviser. A review status shows only what a reviewer checked, on the date shown. Read the <a href="#risk">investment risk warning</a> before you invest.</p><p><strong>5. Confidentiality.</strong> Founder profiles, pitches, evidence summaries, updates and messages are confidential to the founder. You may use them only to decide whether to ask for an introduction or to invest in that founder's business. You may share them only with your own professional advisers, or, if you invest for a firm, with its staff who need them, and only if those people are bound to keep them confidential. You must not copy them in bulk, download or record pitches, collect founders' details into a list or a database, or use them to compete with the founder or to build a competing service. These duties continue after your account closes.</p><p><strong>6. Your duties as a data controller.</strong> When you receive a founder's personal data through IkonetU, you hold it as a separate controller, and you are responsible for it under the law that applies to you. Keep it secure, use it only as these terms allow, and delete it when you no longer need it.</p><p><strong>7. Contacting founders.</strong> Ask for an introduction through IkonetU. Do not contact a founder outside IkonetU using information you found on it until the founder has accepted your introduction. Never ask a founder for a fee, a deposit or any other payment for an introduction, a review or an investment.</p><p><strong>8. Your investor details.</strong> Your investor type, your firm and your other details must be true. You must not misrepresent your capacity to invest, your regulatory status or the person you act for. Tell us of any change.</p><p><strong>9. Your own legal checks.</strong> You are responsible for your own checks on the founders and businesses you invest in, including checks on money laundering and sanctions. You confirm that the money you invest is not the proceeds of crime.</p></div></section><section aria-labelledby="terms-aup" class="sec-t soft"><div class="wrap sec narrow doc"><h2 id="terms-aup" class="doc-h2">Acceptable use policy</h2><p>This policy applies to everyone who uses IkonetU, and to everything you add, send or link to on IkonetU.</p><h3 class="doc-h3">Content you must not add or send</h3><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">You must not add or send anything that is illegal in the United Kingdom or where you are, including content that promotes fraud, terrorism, child sexual abuse or exploitation, the sale of illegal goods, or violence.</li><li style="margin:0 0 8px">You must not harass, bully, threaten or abuse any person, or stir up hatred against anyone because of race, religion, sex, sexual orientation, disability or any other protected characteristic.</li><li style="margin:0 0 8px">You must not add intimate images of anyone, or sexual content of any kind.</li><li style="margin:0 0 8px">You must not add information that is false or misleading, including forged or altered documents and evidence about a business that is not yours.</li><li style="margin:0 0 8px">You must not promote an investment in a way that breaks the law, or promise or guarantee a return.</li><li style="margin:0 0 8px">You must not add content that infringes copyright, a trade mark or another person's rights, or that breaks a duty of confidence.</li><li style="margin:0 0 8px">You must not share another person's personal data without the right to do so, including identity numbers and bank details.</li><li style="margin:0 0 8px">You must not upload viruses or any other harmful code.</li></ul><h3 class="doc-h3">Things you must not do</h3><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">You must not pretend to be another person or business, or misstate who you act for.</li><li style="margin:0 0 8px">You must not misrepresent your investor type, your capacity to invest or your regulatory status.</li><li style="margin:0 0 8px">You must not ask anyone for money, a fee or their financial details in return for an introduction, a review, funding or an investment.</li><li style="margin:0 0 8px">You must not send advertising, spam or repeated messages that the other person has not asked for.</li><li style="margin:0 0 8px">You must not copy, scrape or collect content or data from IkonetU by automated means, or use it to build a database or a competing service.</li><li style="margin:0 0 8px">You must not test, probe or get around IkonetU's security, access controls or limits, or overload the service.</li><li style="margin:0 0 8px">You must not use another person's account, or open a new account after we have suspended or closed yours.</li><li style="margin:0 0 8px">You must not use information from IkonetU for any purpose other than the one it was shared for.</li><li style="margin:0 0 8px">You must not help or encourage anyone else to do any of these things.</li></ul><p>If you find a weakness in IkonetU's security, tell us at <a href="mailto:info@ikonetu.com">info@ikonetu.com</a> and do not use it.</p><h3 class="doc-h3">What we do when this policy is broken</h3><p>We may remove content, withdraw a review status, hide a profile, suspend or close an account, and report the matter to the police or another authority. We choose a response that matches how serious the breach is, we keep a record of what we did and why, and we tell you, unless the law or someone's safety prevents it. You can report a breach, and ask us to review a decision, as the <a href="/complaints">reporting and complaints policy</a> explains.</p></div></section><section aria-labelledby="risk" class="sec-t"><div class="wrap sec narrow doc"><h2 id="risk" class="doc-h2">Investment risk warning</h2><p>This warning applies to every founder profile on IkonetU, and to every introduction and conversation.</p><div class="doc-warn" style="margin:0 0 24px;padding:20px 24px;border-radius:16px;border:1px solid #F7B27A;background:#FFF6ED"><p><strong>Investing in early-stage businesses is high risk. You could lose all the money you invest.</strong></p><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">Most early-stage businesses fail, and an investment in a business that fails is usually worth nothing.</li><li style="margin:0 0 8px">You are unlikely to be able to sell your shares quickly, and you may not be able to sell them at all until the business is sold or lists its shares.</li><li style="margin:0 0 8px">Your share of the business is likely to fall if it issues new shares later.</li><li style="margin:0 0 8px">Early-stage businesses rarely pay dividends.</li><li style="margin:0 0 8px">IkonetU is not authorised by the Financial Conduct Authority. The Financial Services Compensation Scheme and the Financial Ombudsman Service will not cover an investment that you make after meeting a founder on IkonetU.</li><li style="margin:0 0 8px">Do not invest money that you cannot afford to lose. Spreading your money across several investments reduces the risk, but it does not remove it.</li></ul></div><h3 class="doc-h3">Statement for investors in the United Kingdom</h3><p>The content of this promotion has not been approved by an authorised person within the meaning of the Financial Services and Markets Act 2000. Reliance on this promotion for the purpose of engaging in any investment activity may expose an individual to a significant risk of losing all of the property or other assets invested. If you are in any doubt about the investment to which this promotion relates, you should consult an authorised person specialising in advising on investments of the kind in question.</p></div></section></main><footer class="site-ftr"><div class="wrap ftr-top
