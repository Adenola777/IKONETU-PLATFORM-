rong> You are responsible for your own decisions. Before making or accepting an investment, you should obtain independent legal, financial, tax and other professional advice where appropriate.</p><p><strong>6. Fees.</strong> Access to the Platform is currently free. If we introduce paid features, we will clearly display the price, billing frequency, renewal terms and cancellation route before you are charged.</p><p><strong>7. Intellectual property.</strong> The Platform, including its design, text, graphics, software, logos and organisation, is owned by IkonetU or licensed to us. You retain ownership of content you submit, subject to the Pitch and Content Licence below.</p><p><strong>8. Availability.</strong> We aim to keep the Platform available but do not guarantee uninterrupted or error-free access. We may change, suspend or withdraw features for maintenance, security, legal or commercial reasons.</p><p><strong>9. Limitation of liability.</strong> To the fullest extent permitted by law, IkonetU is not liable for losses arising from reliance on information provided by another user, investment decisions, lost profits, lost data, business interruption or indirect or consequential loss. Nothing in these Terms excludes liability that cannot lawfully be excluded.</p><p><strong>10. Governing law.</strong> These Terms are governed by the laws of England and Wales. The courts of England and Wales have exclusive jurisdiction, except where applicable law gives you a right to bring proceedings elsewhere.</p></div></section><section aria-labelledby="terms-founder" class="sec-t soft"><div class="wrap sec narrow doc"><h2 id="terms-founder" class="doc-h2">Founder terms</h2><p><strong>1. Founder eligibility.</strong> You confirm that you are the founder, director, authorised representative or owner of the business you represent, or that you are properly authorised to submit information and communicate with investors on its behalf.</p><p><strong>2. Information you submit.</strong> from investors, and replace or remove your pitch. To delete your account and its data, write to privacy@ikonetu.com. We may retain certain information where required for legal, security, fraud-prevention or dispute-resolution purposes.</p></div></section><section aria-labelledby="terms-investor" class="sec-t"><div class="wrap sec narrow doc"><h2 id="terms-investor" class="doc-h2">Investor terms</h2><p><strong>1. Investor eligibility.</strong> You confirm that you are legally permitted to use the Platform and to view information about early-stage companies in your jurisdiction. You are responsible for determining whether any investment is suitable for you.</p><p><strong>2. Founder information.</strong> Founder profiles, pitches, evidence and related information are provided by founders or their authorised representatives. IkonetU does not independently guarantee the accuracy, completeness, legality or financial performance of any founder, company or investment.</p><p><strong>3. No advice or recommendation.</strong> IkonetU does not provide investment advice or recommendations. Nothing on the Platform constitutes a personal recommendation, financial advice, an offer of securities, an invitation or inducement to engage in investment activity, a promise of return, or a valuation.</p><p><strong>4. Due diligence.</strong> Before entering into any transaction, you must conduct your own due diligence and obtain independent legal, tax, financial and other professional advice where appropriate.</p><p><strong>5. Introductions.</strong> When you request an introduction, IkonetU may share your contact details with the founder, subject to the founder's privacy settings. IkonetU does not guarantee that a founder will respond or accept an introduction.</p><p><strong>6. Investor status.</strong> You must not misrepresent your investor type, investment capacity, regulatory status or affiliation.</p></div></section><section aria-labelledby="terms-aup" class="sec-t soft"><div class="wr
