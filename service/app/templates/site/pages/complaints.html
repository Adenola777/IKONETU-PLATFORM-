}}&quot;}">For investors</a> <a class="navlink" href="/trust-and-safety" data-a="{&quot;aria-current&quot;: &quot;{{cur.trust}}&quot;}">Trust and safety</a> <a class="navlink" href="/signin" data-a="{&quot;aria-current&quot;: &quot;{{cur.signin}}&quot;}">Sign in</a> </nav><div id="site-ctas" class="hdr-ctas " data-a="{&quot;class&quot;: &quot;hdr-ctas {{navClass}}&quot;}"> <template data-if="founderFirst"><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a></template><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a><template data-end></template> <template data-if="investorFirst"><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a></template><template data-end></template> </div></div></header> <main id="main"><section aria-labelledby="l-title"><div class="wrap narrow" style="padding-top:88px;padding-bottom:40px"><p class="lbl" style="margin-bottom:20px">Legal</p><h1 id="l-title" class="h1">Reporting and complaints</h1><p class="small" style="margin:0 0 24px">This policy is dated 21 October 2026. It explains how to report content or a user, what we do with a report, how to ask us to review a decision and how to complain about IkonetU. Questions about it go to <a href="mailto:info@ikonetu.com">info@ikonetu.com</a>.</p><nav aria-label="Legal pages" class="legalnav"><a href="/privacy">Privacy policy</a><a href="/terms">Terms</a><a href="/cookies">Cookie policy</a><a href="/complaints" aria-current="page">Reporting and complaints</a></nav><nav aria-label="On this page" class="toc" style="margin-top:16px"> <a class="tlink" href="#rc-1">Report something</a> <a class="tlink" href="#rc-2">What happens next</a> <a class="tlink" href="#rc-3">Ask for a review</a> <a class="tlink" href="#rc-4">Copyright and other rights</a> <a class="tlink" href="#rc-5">Complain about IkonetU</a> </nav></div></section><section aria-labelledby="rc-1" class="sec-t"><div class="wrap sec narrow doc"><h2 id="rc-1" class="doc-h2">1. How to report content or a user</h2><p>You can report any content, user or conversation on IkonetU if you think it is illegal, breaks the acceptable use policy, infringes your rights or puts someone at risk. You do not need an account to make a report.</p><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">In a conversation, choose “report this conversation to IkonetU”. Your email program opens a message to us with the conversation's reference filled in. Add what happened, and send it.</li><li style="margin:0 0 8px">For anything else, email <a href="mailto:info@ikonetu.com">info@ikonetu.com</a>. Tell us what you are reporting, where it is, for example the founder's or the venture's name, and why you are reporting it.</li><li style="margin:0 0 8px">If you believe that someone is in immediate danger, contact the police first.</li><li style="margin:0 0 8px">For a concern about your personal data, email <a href="mailto:privacy@ikonetu.com">privacy@ikonetu.com</a>.</li><li style="margin:0 0 8px">For a claim that content infringes your copyright or other rights, follow section 4.</li></ul></div></section><section aria-labelledby="rc-2" class="sec-t soft"><div class="wrap sec narrow doc"><h2 id="rc-2" class="doc-h2">2. What happens after you report</h2><p>We acknowledge each report within two working days. A member of the IkonetU team looks at the content and at what you told us, and decides whether it breaks the law or our terms. We deal first with reports about a risk to someone's safety and about illegal content. We aim to decide within ten working days, and we tell you the outcome.</p><p>If content is illegal, we remove it or hide it as soon as we can, and we may report it to the police. While we look into a report, we may hide the content or suspend the account concerned. We do not tell the person you reported who you are, unless the law requires it or you agree.</p><p>Depending on what we find, we may take one or more of these steps:</p><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">We take no action, if the content breaks no rule.</li><li style="margin:0 0 8px">We remove the content, or withdraw a review status.</li><li style="margin:0 0 8px">We hide a founder profile from investors.</li><li style="margin:0 0 8px">We suspend an account, so that it cannot be seen or used until we lift the suspension.</li><li style="margin:0 0 8px">We close an account.</li><li style="margin:0 0 8px">We report the matter to the police or another authority.</li></ul><p>We tell the person affected what we did and why, unless the law or someone's safety prevents it. We do not act against anyone for a report made in good faith, even when we find no breach. A report that is knowingly false, or that is made to harass someone, breaks the acceptable use policy.</p></div></section><section aria-labelledby="rc-3" class="sec-t"><div class="wrap sec narrow doc"><h2 id="rc-3" class="doc-h2">3. How to ask us to review a decision</h2><p>You can ask us to look again if we removed your content, declined your evidence or withdrew its status, declined, suspended or closed your account, or made a decision on your report that you disagree with. Email <a href="mailto:info@ikonetu.com">info@ikonetu.com</a> within 30 days of hearing from us. Tell us which decision you mean and why you think it is wrong.</p><p>Where we can, a person who was not involved in the first decision carries out the review. We aim to answer within 15 working days. If we find that the decision was wrong, we reverse it and put right its effects where we can.</p></div></section><section aria-labelledby="rc-4" class="sec-t soft"><div class="wrap sec narrow doc"><h2 id="rc-4" class="doc-h2">4. Copyright and other rights</h2><p>If you believe that content on IkonetU infringes your copyright, trade mark or other rights, email <a href="mailto:legal@ikonetu.com">legal@ikonetu.com</a> with the following:</p><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">Give your name and how to contact you.</li><li style="margin:0 0 8px">Identify the work or the right concerned.</li><li style="margin:0 0 8px">Say where the content is on IkonetU.</li><li style="margin:0 0 8px">Explain why you believe it infringes your right.</li><li style="margin:0 0 8px">Confirm that the information in your notice is accurate, and that you own the right or act for its owner.</li></ul><p>Where the claim is clear, we hide the content while we look into it, and we tell the person who added it. That person can reply to explain why the content does not infringe. We decide in the light of both replies, and we tell both of you the outcome.</p></div></section><section aria-labelledby="rc-5" class="sec-t"><div class="wrap sec narrow doc"><h2 id="rc-5" class="doc-h2">5. How to complain about IkonetU</h2><p>If you are unhappy with IkonetU itself, for example with how we handled a report, a review or your account, email <a href="mailto:info@ikonetu.com">info@ikonetu.com</a> with “Complaint” in the subject line. We acknowledge your complaint within two working days and answer it within 15 working days. If we need longer, we tell you why and when you will hear from us. If you are still unhappy, you can ask for your complaint to go to a director of IkonetU Technology Limited, who answers within a further 15 working days.</p><p>If your complaint is about personal data, you can also complain to the Information Commissioner's Office or to the data protection regulator in your country, as the <a href="/privacy#pp-8">privacy policy</a> explains.</p><p>We keep reports, complaints, our decisions and our reasons for six years, so that we can show how we dealt with each one.</p></div></section></main><footer class="site-ftr"><div class="wrap ftr-top"><div class="ftr-brand"> <a class="ftr-logo" href="/" aria-label="IkonetU home"><svg aria-hidden="true" width="148.5" height="34" viewBox="0 0 148.51 34.00" style="display:block;flex:none"><g transform="translate(-7.286 -2.429) scale(0.8095)"><path d="M9 4.5 Q9 3 10.5 3 L37.5 3 Q39 3 39 4.5 L39 10.5 Q39 12 37.5 12 L34.5 12 Q33 12 33 13.5 L33 28.5 Q33 30 31.5 30 L28.5 30 Q27 30 27 28.5 L27 13.5 Q27 12 25.5 12 L10.5 12 Q9 12 9 10.5 Z" fill="#FFFFFF"></path><path d="M39 43.5 Q39 45 37.5 45 L10.5 45 Q9 45 9 43.5 L9 37.5 Q9 36 10.5 36 L13.5 36 Q15 36 15 34.5 L15 19.5 Q15 18 16.5 18 L19.5 18 Q21 18 21 19.5 L21 34.5 Q21 36 22.5 36 L37.5 36 Q39 36 39 37.5 Z" fill="#F26B1D"></path></g><g transform="translate(33.651 8.053) scale(0.02402)"><path d="M72 745V0H208V745Z M426.0 745V0H562.0V388L525.0 375L842.0 0H1013.0L716.0 352L724.0 256L1022.0 745H862.0L662.0 417L562.0 536V745Z M1527.0 757Q1445.0 757 1374.0 728.0Q1303.0 699 1250.0 647.0Q1197.0 595 1167.5 524.5Q1138.0 454 1138.0 372Q1138.0 289 1167.0 219.0Q1196.0 149 1249.0 97.0Q1302.0 45 1373.0 16.5Q1444.0 -12 1527.0 -12Q1610.0 -12 1681.0 17.0Q1752.0 46 1805.0 97.5Q1858.0 149 1887.5 219.0Q1917.0 289 1917.0 372Q1917.0 454 1887.0 524.5Q1857.0 595 1804.0 647.0Q1751.0 699 1680.5 728.0Q1610.0 757 1527.0 757ZM1527.0 633Q1582.0 633 1628.0 613.5Q1674.0 594 1708.5 559.0Q1743.0 524 1761.5 476.0Q1780.0 428 1780.0 372Q1780.0 316 1761.5 268.5Q1743.0 221 1708.5 185.5Q1674.0 150 1628.0 131.0Q1582.0 112 1527.0 112Q1473.0 112 1427.0 131.0Q1381.0 150 1346.5 185.5Q1312.0 221 1293.0 268.5Q1274.0 316 1274.0 372Q1274.0 428 1293.0 476.0Q1312.0 524 1346.5 559.0Q1381.0 594 1427.0 613.5Q1473.0 633 1527.0 633Z M2113.0 745V0H2219.0L262
