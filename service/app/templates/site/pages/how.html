e="margin-bottom:32px">A recording of the website with sample founders. It has no sound, and its captions are on from the start.</p><video class="walkvid" poster="/media/walkthrough-poster.jpg" preload="metadata" aria-describedby="h-vnote" data-ref="walkVideoRef"><source src="/media/walkthrough.webm" type="video/webm"><source src="/media/walkthrough.mp4" type="video/mp4"></video><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:12px"><p id="h-vnote" class="small" style="margin:0"><ik-t data-t="walkLength">1:24</ik-t> · No sound · Captions can be switched off in the player's menu.</p> <button type="button" class="ctrl" aria-expanded="false" aria-controls="h-transcript" data-a="{&quot;aria-expanded&quot;: &quot;{{walkTranscriptOpen}}&quot;}" data-on="click:toggleWalkTranscript"><svg class="lucide lucide-file-text" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>Transcript</button> </div><div id="h-transcript"><template data-if="walkTranscriptOpen"><ol style="list-style:none;margin:16px 0 0;padding:16px;border-radius:12px;background:#FAFAF8;border:1px solid #E7EAF0;display:flex;flex-direction:column;gap:8px;font-size:15px"><template data-for="walkLines" data-as="l"><li style="display:flex;gap:12px"><span style="flex:0 0 40px;color:#475467;font-variant-numeric:tabular-nums" data-t="l.at"></span><span style="min-width:0" data-t="l.text"></span></li></template><template data-end></template></ol></template><template data-end></template></div></div></section><section aria-labelledby="h-stages" class="sec-t"><div class="wrap sec"><h2 id="h-stages" class="h2">Four stages</h2><p class="lede" style="margin-bottom:32px">The stages are the same for every founder. Nobody competes, and no founder's progress changes another founder's profile.</p><div><div class="stage"><span class="num">1</span><h3 class="h3">One-minute pitch</h3><span></span><p class="body2"><strong style="color:#101828;font-weight:600">Founders</strong> record what they are building and why now, and type what they say. The captions are made from it.</p><p class="body2"><strong style="color:#101828;font-weight:600">Investors</strong> watch a muted preview from search, or the full pitch with captions and a transcript.</p></div><div class="stage"><span class="num">2</span><h3 class="h3">Evidence</h3><span></span><p class="body2"><strong style="color:#101828;font-weight:600">Founders</strong> add evidence across eight areas, from registration and revenue to product, market and team, at their own pace.</p><p class="body2"><strong style="color:#101828;font-weight:600">Investors</strong> see each piece with its status: founder submitted, platform reviewed, or third-party evidence available.</p></div><div class="stage"><span class="num">3</span><h3 class="h3">Readiness check</h3><span></span><p class="body2"><strong style="color:#101828;font-weight:600">Founders</strong> see where their evidence is strong and where it is thin, with three next steps at a time.</p><p class="body2"><strong style="color:#101828;font-weight:600">Investors</strong> see the same eight areas. The check never ranks one founder against another.</p></div><div class="stage"><span class="num">4</span><h3 class="h3">Introduction</h3><span></span><p class="body2"><strong style="color:#101828;font-weight:600">Founders</strong> accept or decline each request, and do not have to give a reason.</p><p class="body2"><strong style="color:#101828;font-weight:600">Investors</strong> request an introduction with a short note. An accepted request opens a conversation on IkonetU.</p></div></div></div></section><section aria-labelledby="h-ne
