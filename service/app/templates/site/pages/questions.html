quot;}">For investors</a> <a class="navlink" href="/how-it-works" data-a="{&quot;aria-current&quot;: &quot;{{cur.how}}&quot;}">How it works</a> <a class="navlink" href="/trust-and-safety" data-a="{&quot;aria-current&quot;: &quot;{{cur.trust}}&quot;}">Trust and safety</a> <a class="navlink" href="/signin" data-a="{&quot;aria-current&quot;: &quot;{{cur.signin}}&quot;}">Sign in</a> </nav><div id="site-ctas" class="hdr-ctas " data-a="{&quot;class&quot;: &quot;hdr-ctas {{navClass}}&quot;}"> <template data-if="founderFirst"><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a></template><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a><template data-end></template> <template data-if="investorFirst"><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a></template><template data-end></template> </div></div></header> <main id="main"><section aria-labelledby="q-title"><div class="wrap" style="padding-top:88px;padding-bottom:40px"><p class="lbl" style="margin-bottom:20px">Questions</p><h1 id="q-title" class="h1" style="max-width:900px">Questions founders and investors ask</h1></div></section><section aria-labelledby="q-f" class="sec-t"><div class="wrap sec narrow faq"><h2 id="q-f" class="h2" style="margin-bottom:24px">For founders</h2><details><summary>Is IkonetU a competition?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>No. IkonetU has no rankings, rounds or winners. Each founder builds their own profile, and the readiness check reflects only that founder's evidence.</p></details><details><summary>Who can join?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>Founders aged 18 or over in Nigeria, Ghana or Kenya. Investors aged 18 or over can join from any country, once an IkonetU admin approves their account.</p></details><details><summary>What counts as evidence?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>Anything that shows progress and can be checked: product links, usage figures, bank statements, management accounts, customer references, company registration and team details.</p></details><details><summary>What does the readiness check do?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>It shows where your evidence is strong, building or missing across eight areas, and suggests three next steps. It does not compare you with other founders, and completing it does not lead to funding by itself.</p></details><details><summary>What does it cost?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>IkonetU is currently free. If paid features come later, their price, billing and cancellation route will be shown before anyone is charged.</p></details></div></section><section aria-labelledby="q-i" class="sec-t soft"><div class="wrap sec narrow faq"><h2 id="q-i" class="h2" style="margin-bottom:24px">For investors</h2><details><summary>What do investors see?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>The one-minute pitch, the profile details and the founder's ask, the readiness check, each piece of evidence with its review status, and recent activity. Investors never see the documents a founder uploads for review.</p></details><details><summary>What does "Platform reviewed" mean?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>An IkonetU reviewer compared that piece of evidence with its source on the date shown. It is not an audit, a valuation or an endorsement of the company.</p></details><details><summary>Does IkonetU recommend companies?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>No. IkonetU does not provide investment advice, endorse companies or make investment decisions. Investors decide for themselves after their own diligence.</p></details><details><summary>How do introductions work?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>An investor requests an introduction with a short note, and the founder accepts or declines. An accepted request opens a conversation on IkonetU.</p></details><details><summary>How do investor accounts work?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>An investor <a href="/signin">creates an account</a> and says what they invest in. An IkonetU admin checks each investor account before it can browse founder profiles and request introductions.</p></details></div></section><section aria-labelledby="q-t" class="sec-t"><div class="wrap sec narrow faq"><h2 id="q-t" class="h2" style="margin-bottom:24px">Trust and data</h2><details><summary>Is my data private?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>Your profile shows only what you choose to share. Documents you upload for review are seen by you and IkonetU's reviewers, not by investors.</p></details><details><summary>Can I delete my profile?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>You can edit your venture's details, hide your profile from investors at any time, and replace or remove your pitch. To delete your account and its data, write to privacy@ikonetu.com. IkonetU may keep some information where the law, security, fraud prevention or a dispute requires it. Account data is kept for one year after the account closes, and profile and pitch data for one year after the profile is deleted.</p></details><details><summary>Does a strong readiness check guarantee investment?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>No. The readiness check helps founders improve and helps investors find relevant companies. It is not an investment recommendation, a valuation or a promise of funding.</p></details><details><summary>Where is IkonetU registered?<span class="plus" style="display:inline-flex;color:#475467"><svg class="lucide lucide-plus" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></summary><p>IkonetU Technology Limited is registered in England and Wales, company number 17110122. Its registered office is Maisonette 3, 23 Watkins Road, Leicester, United Kingdom.</p></details></div></section></main><footer class="site-ftr"><div class="wrap ftr-top"><div class="ftr-brand"> <a class="ftr-logo" href="/" aria-label="IkonetU home"><svg aria-hidden="true" width="148.5" height="34" viewBox="0 0 148.51 34.00" style="display:block;flex:none"><g transform="translate(-7.286 -2.429) scale(0.8095)"><path d="M9 4.5 Q9 3 10.5 3 L37.5 3 Q39 3 39 4.5 L39 10.5 Q39 12 37.5 12 L34.5 12 Q33 12 33 13.5 L33 28.5 Q33 30 31.5 30 L28.5 30 Q27 30 27 28.5 L27 13.5 Q27 12 25.5 12 L10.5 12 Q9 12 9 10.5 Z" fill="#FFFFFF"></path><path d="M39 43.5 Q39 45 37.5 45 L10.5 45 Q9 45 9 43.5 L9 37.5 Q9 36 10.5 36 L13.5 36 Q15 36 15 34.5 L15 19.5 Q15 18 16.5 18 L19.5 18 Q21 18 21 19.5 L21 34.5 Q21 36 22.5 36 L37.5 36 Q39 36 39 37.5 Z" fill="#F26B1D"></path></g><g transform="translate(33.651 8.053) scale(0.02402)"><path d="M72 745V0H208V745Z M426.0 745V0H562.0V388L525.0 375L842.0 0H1013.0L716.0 352L724.0 256L1022.0 745H862.0L662.0 417L562.0 536V745Z M1527.0 757Q1445.0 757 1374.0 728.0Q1303.0 699 1250.0 647.0Q1197.0 595 1167.5 524.5Q1138.0 454 1138.0 372Q1138.0 289 1167.0 219.0Q1196.0 149 1249.0 97.0Q1302.0 45 1373.0 16.5Q1444.0 -12 1527.0 -12Q1610.0 -12 1681.0 17.0Q1752.0 46 1805.0 97.5Q1858.0 149 1887.5 219.0Q1917.0 289 1917.0 372Q1917.0 454 1887.0 524.5Q1857.0 595 1804.0 647.0Q1751.0 699 1680.5 728.0Q1610.0 757 1527.0 757ZM1527.0 633Q1582.0 633 1628.0 613.5Q1674.0 594 1708.5 559.0Q1743.0 524 1761.5 476.0Q1780.0 428 1780.0 372Q1780.0 316 1761.5 268.5Q1743.0 221 1708.5 185.5Q1674.0 150 1628.0 131.0Q1582.0 112 1527.0 112Q1473.0 112 1427.0 131.0Q1381.0 150 1346.5 185.5Q1312.0 221 1293.0 268.5Q1274.0 316 1274.0 372Q1274.0 428 1293.0 476.0Q1312.0 524 1346.
