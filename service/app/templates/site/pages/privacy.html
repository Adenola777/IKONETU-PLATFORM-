 Data controller</h2><dl class="kv" style="margin-bottom:8px"><dt style="color:#475467">Data controller</dt><dd style="margin:0;font-weight:600">IkonetU Technology Limited</dd><dt style="color:#475467">Company number</dt><dd style="margin:0;font-weight:600">17110122</dd><dt style="color:#475467">Registered office</dt><dd style="margin:0;font-weight:600">Maisonette 3, 23 Watkins Road, Leicester, United Kingdom</dd><dt style="color:#475467">ICO registration number</dt><dd style="margin:0"><span class="ph">[TO CONFIRM]</span></dd><dt style="color:#475467">Data Protection Officer</dt><dd style="margin:0;font-weight:600">Adenola Adegbesan</dd><dt style="color:#475467">Privacy contact</dt><dd style="margin:0"><a href="mailto:privacy@ikonetu.com" style="font-weight:600">privacy@ikonetu.com</a></dd><dt style="color:#475467">General contact</dt><dd style="margin:0"><a href="mailto:info@ikonetu.com" style="font-weight:600">info@ikonetu.com</a></dd></dl><h2 class="doc-h2">2. Personal data we collect</h2><p>We may collect account data (name, email address, role, profile photo, country and city, and phone number where provided); founder profile data (company details, sector and stage, one-minute pitch video, transcript or captions, product information, traction and customer information, revenue or financial information, team information, documents and links, references, Readiness Check responses and results, profile updates and momentum activity); investor profile data (investor type, organisation or fund name, investment focus, stage, geography and sector preferences, check size where provided, profile activity and introduction requests); technical data (IP address, device type, browser type, operating system, pages viewed, buttons clicked, session activity, cookies and similar technologies); and communications (messages, support requests, feedback and marketing preferences).</p><h2 class="doc-h2">3. How we use personal data</h2><p>We use personal data to create and manage accounts; display founder and investor profiles; operate the readiness check; enable investor discovery and filtering; facilitate introductions; provide support; improve the Platform; prevent fraud, misuse and security incidents; comply with legal obligations; and send service updates and, where permitted, marketing communications.</p><h2 class="doc-h2">4. Lawful bases</h2><div class="scroll" style="margin-bottom:16px"><table class="tbl" style="min-width:520px"><thead><tr><th style="width:55%">Purpose</th><th>Lawful basis</th></tr></thead><tbody><tr><td>Providing the Platform and account services</td><td>Performance of a contract</td></tr><tr><td>Profile visibility, introductions and platform features</td><td>Performance of a contract and legitimate interests</td></tr><tr><td>Security, fraud prevention and platform integrity</td><td>Legitimate interests and legal obligation</td></tr><tr><td>Service improvement</td><td>Consent and/or legitimate interests</td></tr><tr><td>Marketing communications</td><td>Consent</td></tr><tr><td>Legal claims, compliance and regulatory requests</td><td>Legal obligation and legitimate interests</td></tr></tbody></table></div><h2 class="doc-h2">5. Who we share data with</h2><p>We may share personal data with the relevant founder or investor when an introduction is requested; service providers who host, store, analyse or support the Platform; payment providers where applicable; professional advisers, auditors or insurers; law enforcement, regulators or courts where legally required; and a buyer or successor in the event of a corporate transaction, subject to appropriate safeguards. We do not sell personal data.</p><h2 class="doc-h2">6. International transfers</h2><p>If personal data is transferred outside the UK, we will use appropriate safeguards, such as the UK International Data Transfer Addendum, standard contractual clauses or another lawful transfer mechanism. Current hosting and sub-processors: Render (hosting, in Frankfurt, Germany) and Supabase (sign-in and sign-in emails, the database, and stored files, including pitch videos and evidence documents). IkonetU uses no analytics or payment provider.</p><h2 class="doc-h2">7. Retention</h2><p>We retain personal data only for as long as necessary for the purposes described in this policy. Account data: while your account is active and for one year after it is closed. Founder profile and pitch data: while your profile is active and for one year after deletion. Accounts are closed and profiles deleted on request: write to privacy@ikonetu.com. Introduction records: one year. Support communications: one year. Security and fraud records: one year. Legal and accounting records: as required by law.</p><h2 class="doc-h2">8. Your rights</h2><p>You may have the right to access your personal data; correct inaccurate data; delete your data; restrict or object to processing; withdraw consent; data portability; and complain to the Information Commissioner's Office. To exercise your rights, contact <a href="mailto:privacy@ikonetu.com">privacy@ikonetu.com</a>.</p><h2 class="doc-h2">9. Security</h2><p>We use technical and organisational measures appropriate to the risk, including access controls, encryption in transit, secure hosting and monitoring. No online platform can guarantee complete security. IkonetU signs you in with a one-time link or code sent to your email address, so there is no password to choose. You should keep access to that email account secure. Sign-in by phone is not available yet.</p><h2 class="doc-h2">10. Children</h2><p>The Platform is not intended for children under 18. We do not knowingly collect personal data from anyone under 18, and sign-up asks every person to confirm that they are 18 or older.</p></div></section></main><footer class="site-ftr"><div class="wrap ftr-top"><div class="ftr-brand"> <a class="ftr-logo" href="/" aria-label="IkonetU home"><svg aria-hidden="true" width="148.5" height="34" viewBox="0 0 148.51 34.00" style="display
