V311H3404.0V431H3065.0V625H3424.0V745Z M3725.0 745V120H3532.0V0H4052.0V120H3862.0V745Z M4487.0 757Q4401.0 757 4334.5 721.0Q4268.0 685 4230.0 622.0Q4192.0 559 4192.0 479V0H4328.0V472Q4328.0 518 4348.5 555.0Q4369.0 592 4405.0 612.5Q4441.0 633 4487.0 633Q4534.0 633 4569.5 612.5Q4605.0 592 4625.5 555.0Q4646.0 518 4646.0 472V0H4782.0V479Q4782.0 559 4744.0 622.0Q4706.0 685 4639.5 721.0Q4573.0 757 4487.0 757Z" fill="#123C7A"></path></g></svg></a> <button type="button" class="menubtn" aria-expanded="false" aria-controls="site-nav site-ctas" data-a="{&quot;aria-expanded&quot;: &quot;{{menuOpen}}&quot;}" data-on="click:toggleMenu" data-ref="menuRef">Menu</button> <nav id="site-nav" aria-label="Main" class="hdr-nav " data-a="{&quot;class&quot;: &quot;hdr-nav {{navClass}}&quot;}"> <a class="navlink" href="/for-founders" data-a="{&quot;aria-current&quot;: &quot;{{cur.founders}}&quot;}">For founders</a> <a class="navlink" href="/for-investors" data-a="{&quot;aria-current&quot;: &quot;{{cur.investors}}&quot;}">For investors</a> <a class="navlink" href="/trust-and-safety" data-a="{&quot;aria-current&quot;: &quot;{{cur.trust}}&quot;}">Trust and safety</a> <a class="navlink" href="/pricing" data-a="{&quot;aria-current&quot;: &quot;{{cur.pricing}}&quot;}">Pricing</a> <a class="navlink" href="/signin" data-a="{&quot;aria-current&quot;: &quot;{{cur.signin}}&quot;}">Sign in</a> </nav><div id="site-ctas" class="hdr-ctas " data-a="{&quot;class&quot;: &quot;hdr-ctas {{navClass}}&quot;}"> <template data-if="founderFirst"><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a></template><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a><template data-end></template> <template data-if="investorFirst"><a class="btn btn-io btn-sm" href="/for-investors" data-on="click:chooseInvestor">Explore as an investor</a><a class="btn btn-f btn-sm" href="/signin" data-on="click:chooseFounder">Create founder profile</a></template><template data-end></template> </div></div></header> <main id="main"><section aria-labelledby="l-title" class="hero-c legal-hero"><div class="wrap narrow"><p class="lbl" style="margin-bottom:20px">Legal</p><h1 id="l-title" class="h1">Privacy policy</h1><p class="small legal-date">This version is dated 21 October 2026 and replaces the version of 15 October 2026. Questions about it go to <a href="mailto:privacy@ikonetu.com">privacy@ikonetu.com</a>.</p><nav aria-label="Legal pages" class="legalnav"><a href="/privacy" aria-current="page">Privacy policy</a><a href="/terms">Terms</a><a href="/cookies">Cookie policy</a><a href="/complaints">Reporting and complaints</a></nav><nav aria-label="On this page" class="toc" style="margin-top:16px"> <a class="tlink" href="#pp-1">Who we are</a> <a class="tlink" href="#pp-2">What we hold</a> <a class="tlink" href="#pp-3">Why we use it</a> <a class="tlink" href="#pp-4">The IkonetU Score</a> <a class="tlink" href="#pp-5">Who sees it</a> <a class="tlink" href="#pp-6">Where it is stored</a> <a class="tlink" href="#pp-7">How long we keep it</a> <a class="tlink" href="#pp-8">Your rights</a> <a class="tlink" href="#pp-9">Security</a> <a class="tlink" href="#pp-10">Children</a> <a class="tlink" href="#pp-11">Changes</a> </nav></div></section><section aria-labelledby="pp-1" class="sec-t"><div class="wrap sec read doc"><h2 id="pp-1" class="doc-h2">1. Who we are</h2><p>IkonetU Technology Limited runs the IkonetU website and app. In this policy, “IkonetU”, “we” and “us” mean that company. We decide how and why your personal data is used, so we are its controller under UK data protection law.</p><dl class="kv" style="margin-bottom:24px"><dt style="color:#475467">Controller</dt><dd style="margin:0;font-weight:600">IkonetU Technology Limited</dd><dt style="color:#475467">Company number</dt><dd style="margin:0;font-weight:600">17110122, registered in England and Wales</dd><dt style="color:#475467">Registered office</dt><dd style="margin:0;font-weight:600">Maisonette 3, 23 Watkins Road, Leicester, United Kingdom</dd><dt style="color:#475467">Privacy contact</dt><dd style="margin:0;font-weight:600"><a href="mailto:privacy@ikonetu.com" style="font-weight:600">privacy@ikonetu.com</a></dd><dt style="color:#475467">General contact</dt><dd style="margin:0;font-weight:600"><a href="mailto:info@ikonetu.com" style="font-weight:600">info@ikonetu.com</a></dd></dl><p>We have not appointed a data protection officer. Our privacy contact answers every question about personal data and every request to use your rights, at <a href="mailto:privacy@ikonetu.com">privacy@ikonetu.com</a>.</p><p>This policy covers visitors to the website, founders who create a profile, investors who create an account, people whose details a founder includes in a profile or in evidence, and anyone who writes to us.</p></div></section><section aria-labelledby="pp-2" class="sec-t soft"><div class="wrap sec read doc"><h2 id="pp-2" class="doc-h2">2. The personal data we hold</h2><p>The table lists every kind of personal data that IkonetU holds, and where each kind comes from.</p><div class="scroll" style="margin-bottom:16px"><table class="tbl" style="min-width:720px"><thead><tr><th style="width:22%">Data</th><th>What it includes</th><th style="width:26%">Where it comes from</th></tr></thead><tbody><tr><td>Sign-in details</td><td>Your email address, and a record of each sign-in with its time, your IP address and the description your browser gives of itself. IkonetU does not offer sign-in by phone yet.</td><td>You give your email address. Your browser supplies the rest when you sign in.</td></tr><tr><td>Founder profile</td><td>Your name, country and city, a short biography, the university, college or institution you study at or graduated from, your student or graduate status, and when you confirmed being a student founder. Your venture's name, sector, stage, country and description, the amount you are raising and what for, and its registration number, website and social media addresses if you add them.</td><td>You give it.</td></tr><tr><td>Pitch</td><td>Your pitch video, which shows your face and carries your voice, and the transcript you type for it.</td><td>You give it.</td></tr><tr><td>Evidence</td><td>The documents, images and links you add as evidence, and the summary you write for each. Evidence can include identity documents such as a passport or a national identity card, proof of address, academic records, company records, financial records, bank statements and customer information. It also includes statements you make about yourself or your venture, such as having named a next of kin.</td><td>You give it. A reviewer may also compare it with a public register or another source that it names.</td></tr><tr><td>Review records</td><td>Each reviewer's decision on a piece of evidence, the status it gives, the date, the public note and the reason recorded.</td><td>IkonetU reviewers make them.</td></tr><tr><td>IkonetU Score</td><td>Your score, its league, the points in each of its eleven areas, and a monthly record of these.</td><td>We calculate it from your evidence.</td></tr><tr><td>Updates</td><td>The progress updates you post.</td><td>You give them.</td></tr><tr><td>Investor profile</td><td>Your name, investor type, fund or firm, website or LinkedIn address, where you are based, the sectors, stages and countries you invest in, your typical cheque size and what you look for. Your confirmation that your investor type describes you, and our decision to approve or decline your account.</td><td>You give it. IkonetU admins record the decision.</td></tr><tr><td>Introductions and messages</td><td>Each request for an introduction and its note, the founder's answer, and the messages in the conversation that follows.</td><td>The founder and the investor give them.</td></tr><tr><td>Your choices</td><td>Your answers to the optional questions at sign-up, your confirmation that you are 18 or older, and the version of this policy you read, each with its date.</td><td>You give them.</td></tr><tr><td>Moderation and safety records</td><td>Reports, our decisions on them, suspensions and their reasons, profiles hidden from investors and why, and a log of what each IkonetU reviewer and admin changed.</td><td>Users and IkonetU staff create them.</td></tr><tr><td>Messages to us</td><td>What you write to us by email, and our replies.</td><td>You give them.</td></tr><tr><td>Technical records</td><td>Records of each request to the app, which can include your IP address, the address requested and the time.</td><td>Your browser supplies them.</td></tr><tr><td>People a founder names</td><td>The names and details of team members, customers, referees, a next of kin and other people that a founder includes in a profile, a pitch or evidence.</td><td>The founder gives them.</td></tr></tbody></table></div><p>We do not ask for information about your health, religion, ethnic origin, political opinions, trade union membership, sex life or sexual orientation, or for any criminal record. Please leave such information out of your profile and your evidence. Identity documents and pitch videos show your face, and we do not use them to identify you by automated means such as face recognition.</p><p>The website uses no analytics, so we do not track which pages you visit or what you click.</p></div></section><section aria-labelledby="pp-3" class="sec-t"><div class="wrap sec read doc"><h2 id="pp-3" class="doc-h2">3. Why we use it and our lawful basis</h2><p>UK data protection law allows us to use personal data only when we have a lawful basis. The table gives the basis for each use.</p><div class="scroll" style="margin-bottom:16px"><table class="tbl" style="min-width:560px"><thead><tr><th style="width:45%">Purpose</th><th>Lawful basis</th></tr></thead><tbody><tr><td>Signing you in and keeping your account secure</td><td><strong>Contract.</strong> We need it to give you the account you asked for.</td></tr><tr><td>Showing your founder profile to approved investors once you publish it</td><td><strong>Contract.</strong> Showing your profile is the service you ask for when you publish it.</td></tr><tr><td>Reviewing the evidence you add</td><td><strong>Contract.</strong> When you add evidence, you ask us to review it.</td></tr><tr><td>Calculating your IkonetU Score and showing it to you</td><td><strong>Contract.</strong> The score is part of the service we give founders.</td></tr><tr><td>Checking and approving investor accounts, and keeping the statements that UK investors give</td><td><strong>Legitimate interests.</strong> We let only genuine investors see founders' information, and we keep the evidence that UK law expects of us.</td></tr><tr><td>Introductions and conversations</td><td><strong>Contract.</strong> We need it to pass requests and messages between you and the other user.</td></tr><tr><td>Handling reports, moderating content, suspending accounts and keeping the staff log</td><td><strong>Legitimate interests</strong> in keeping users safe and the service honest, and <strong>legal obligation</strong> where the Online Safety Act 2023 requires it.</td></tr><tr><td>Answering your messages and requests</td><td><strong>Legitimate interests</strong> in answering you, and <strong>legal obligation</strong> when you use a data protection right.</td></tr><tr><td>Protecting IkonetU and its users from fraud, misuse and attacks</td><td><strong>Legitimate interests</strong> in keeping the service secure.</td></tr><tr><td>Showing information about people a founder names</td><td><strong>Legitimate interests.</strong> Founders and investors need to see a venture's real team, customers and references, and we limit what is shown to that purpose.</td></tr><tr><td>Using a founder's pitch in IkonetU's own marketing</td><td><strong>Consent</strong>, which the founder gives separately and can withdraw.</td></tr><tr><td>Keeping records and dealing with legal claims</td><td><strong>Legal obligation</strong>, and <strong>legitimate interests</strong> in establishing and defending our legal position.</td></tr></tbody></table></div><p>Where we rely on legitimate interests, we have weighed our interests against yours, and you can object, as section 8 explains. Where we rely on consent, you can withdraw it at any time by writing to <a href="mailto:privacy@ikonetu.com">privacy@ikonetu.com</a>. Withdrawing consent does not affect what we did before.</p><p>At sign-up we ask whether you would like notifications about your evidence and introductions. IkonetU does not send them yet, and we keep your answer for when it does. Supabase sends the emails that carry your sign-in link or code, on our behalf. We do not send marketing email, and we will ask for your consent before we send any.</p></div></section><section aria-labelledby="pp-4" class="sec-t soft"><div class="wrap sec read doc"><h2 id="pp-4" class="doc-h2">4. The IkonetU Score and the readiness self-check</h2><p>The IkonetU Score is a number from 0 to 1,000. The app calculates it automatically from the evidence on a founder's profile, using a published set of rules that gives points for each kind of evidence in eleven areas. Evidence counts once a reviewer approves it, and some statements count as soon as the founder makes them. The score places a founder in one of four leagues: Early, Rising, Investable and Elite.</p><p>Data protection law calls this profiling. Only the founder and IkonetU staff see the score. Investors do not see it, and investor search sorts founders by company name, never by score. We do not use the score to make any decision about you. People decide on evidence, on investor accounts and on moderation.</p><p>You can ask us how your score was worked out, ask a person to review a status that affects it, and object to the profiling, by writing to <a href="mailto:privacy@ikonetu.com">privacy@ikonetu.com</a>.</p><p>The readiness self-check on the website runs in your browser. It needs no account, and it neither sends nor saves your answers.</p></div></section><section aria-labelledby="pp-5" class="sec-t"><div class="wrap sec read doc"><h2 id="pp-5" class="doc-h2">5. Who sees your data</h2><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">Approved investors see a published founder profile: the pitch, the profile details, the amount being raised, the summaries and statuses of the evidence, and the updates. They do not see the documents behind the evidence, the IkonetU Score, or a founder's email address or phone number.</li><li style="margin:0 0 8px">A founder sees the name, investor type and firm of an investor who asks for an introduction. Once the founder accepts, both of them see the messages in their conversation.</li><li style="margin:0 0 8px">IkonetU reviewers see evidence and its documents in order to review it. IkonetU admins see accounts, profiles and records in order to run and moderate the service. Documents open only through links that expire after five minutes.</li><li style="margin:0 0 8px">Supabase holds our database, our sign-in service and the files you upload, and sends sign-in emails. Render runs the app and keeps records of requests to it. Each of them acts only on our instructions, under a data processing agreement with us.</li><li style="margin:0 0 8px">Our professional advisers, such as lawyers and accountants, see personal data when we need their advice, and they owe us a duty of confidence.</li><li style="margin:0 0 8px">The police, regulators, courts and other authorities receive personal data when the law requires it, or when it is needed to prevent fraud or to protect someone's safety.</li><li style="margin:0 0 8px">A buyer of IkonetU's business or its assets would receive personal data, and would have to use it in line with this policy.</li></ul><p>We do not sell personal data, and we do not share it with advertisers.</p></div></section><section aria-labelledby="pp-6" class="sec-t soft"><div class="wrap sec read doc"><h2 id="pp-6" class="doc-h2">6. Where your data is stored and when it leaves the UK</h2><p>Your data is stored in London, in the United Kingdom. The app that reads it runs on Render's servers in Frankfurt, Germany, which is in the European Economic Area. UK law treats the European Economic Area as protecting personal data adequately, so no further safeguard is needed for that.</p><p>Supabase and Render are companies based in the United States. If either of them reaches your data from outside the UK or the European Economic Area, for example to give technical support, the safeguards in its data processing agreement with us apply.</p><p>Founders and investors outside the UK send their data to us in the United Kingdom when they use IkonetU. We protect that data under UK data protection law and this policy, and we meet the conditions that the law of their country sets for sending personal data abroad.</p><p>An investor who receives information through IkonetU may be in another country. Each investor is responsible for that information under the law that applies to the investor and under our investor terms.</p></div></section><section aria-labelledby="pp-7" class="sec-t"><div class="wrap sec read doc"><h2 id="pp-7" class="doc-h2">7. How long we keep it</h2><p>We keep personal data only as long as we need it. At the end of each period below, we delete the data or remove everything that identifies you.</p><div class="scroll" style="margin-bottom:16px"><table class="tbl" style="min-width:560px"><thead><tr><th style="width:40%">Data</th><th>How long we keep it</th></tr></thead><tbody><tr><td>Account and sign-in details</td><td>While your account is open, and for one year after it closes.</td></tr><tr><td>Records of each sign-in, with IP addresses</td><td>One year from the sign-in.</td></tr><tr><td>Founder profile, updates and IkonetU Score</td><td>While your profile exists, and for one year after it is deleted.</td></tr><tr><td>Pitch video</td><td>While it is on your profile. The app deletes the video when you replace or remove it. We delete the current video within one year after your profile is deleted.</td></tr><tr><td>Evidence files, including identity documents</td><td>While the evidence is on your profile. We delete them within 30 days after your account closes.</td></tr><tr><td>Review records and evidence statuses</td><td>While the evidence is on your profile, and for one year after your account closes.</td></tr><tr><td>Investor profile and our decision on it, and any UK investor statement</td><td>While your account is open, and for one year after it closes.</td></tr><tr><td>Introductions and messages</td><td>While either account is open, and for one year after the second account closes.</td></tr><tr><td>Your choices and consents</td><td>While your account is open, and for six years after it closes, so that we can show what you agreed to.</td></tr><tr><td>Reports, moderation decisions and the staff log</td><td>Six years after the decision.</td></tr><tr><td>Messages to us</td><td>One year after the matter is closed, or six years if it concerns a complaint or a legal claim.</td></tr><tr><td>Technical records of requests</td><td>Render keeps them for a limited period that its service sets, and we do not copy them elsewhere.</td></tr><tr><td>Legal and accounting records</td><td>As long as the law requires.</td></tr></tbody></table></div><p>Deleted data can remain in our providers' backups until those backups are overwritten in their normal cycle. Nobody uses data from a backup except to restore the service.</p></div></section><section aria-labelledby="pp-8" class="sec-t soft"><div class="wrap sec read doc"><h2 id="pp-8" class="doc-h2">8. Your rights</h2><p>You have these rights over your personal data:</p><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">You can ask for a copy of the personal data we hold about you.</li><li style="margin:0 0 8px">You can ask us to correct data that is wrong or incomplete.</li><li style="margin:0 0 8px">You can ask us to delete your data. We will, unless we need to keep part of it for a reason this policy gives, such as a legal claim.</li><li style="margin:0 0 8px">You can ask us to stop using your data while we deal with a complaint about it.</li><li style="margin:0 0 8px">You can object to any use that relies on legitimate interests, including the profiling behind the IkonetU Score.</li><li style="margin:0 0 8px">You can ask for the data you gave us in a common electronic format, to keep or to pass to someone else.</li><li style="margin:0 0 8px">You can withdraw any consent you gave.</li><li style="margin:0 0 8px">You have the right not to be subject to a decision made solely by automated means that has a legal or similarly significant effect on you. We do not make such decisions.</li></ul><p>Write to <a href="mailto:privacy@ikonetu.com">privacy@ikonetu.com</a> from the email address on your account. We may ask you to confirm who you are. We answer within one month. If a request is complex, or if you send several, we may take up to two more months, and we will tell you why within the first month. We do not charge for a request unless it is clearly unfounded or excessive.</p><p>If you live outside the UK, the data protection law of your country may give you further rights, and you can use them by writing to us in the same way.</p><p>If you are unhappy with how we use your data, please tell us first so that we can put it right. You can also complain to a data protection regulator:</p><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">In the United Kingdom, the Information Commissioner's Office, at ico.org.uk.</li><li style="margin:0 0 8px">In another country, its data protection authority. In Nigeria, for example, that is the Nigeria Data Protection Commission, in Ghana the Data Protection Commission and in Kenya the Office of the Data Protection Commissioner.</li></ul></div></section><section aria-labelledby="pp-9" class="sec-t"><div class="wrap sec read doc"><h2 id="pp-9" class="doc-h2">9. How we protect your data</h2><ul style="margin:0 0 16px;padding-left:24px;font-size:17px;line-height:1.7;color:#344054"><li style="margin:0 0 8px">You sign in with a one-time link or code sent to your email address, so there is no password to steal or reuse.</li><li style="margin:0 0 8px">The cookies that hold your sign-in cannot be read by scripts on the page, and your browser sends them only over secure connections.</li><li style="margin:0 0 8px">All traffic to the app is encrypted in transit.</li><li style="margin:0 0 8px">Pitches and evidence files sit in private storage. They open only through links that expire, after one hour for a pitch and five minutes for a document.</li><li style="margin:0 0 8px">The database checks each request against the account that makes it, so one user cannot read another user's private records.</li><li style="margin:0 0 8px">Reviewers and admins have only the access their role needs, and the app records what each of them changes.</li></ul><p>Keep the email account you sign in with secure, because anyone who controls it can sign in as you.</p><p>If a breach puts personal data at risk, we will tell the Information Commissioner's Office within 72 hours of learning of it, and any other regulator whose law requires notice. If the breach is likely to put you at high risk, we will tell you without undue delay what happened and what you can do.</p></div></section><section aria-labelledby="pp-10" class="sec-t soft"><div class="wrap sec read doc"><h2 id="pp-10" class="doc-h2">10. Children</h2><p>IkonetU is for people aged 18 or over. Sign-up asks each person to confirm that they are 18 or older. If we learn that a person under 18 has an account, we close it and delete its data.</p></div></section><section aria-labelledby="pp-11" class="sec-t"><div class="wrap sec read doc"><h2 id="pp-11" class="doc-h2">11. Changes to this policy</h2><p>We post each new version of this policy here with its date. If a change affects how we use your data in a way you would not expect, we will tell you by email or in the app before the change takes effect.</p><p>The <a href="/cookies">cookie policy</a> explains what IkonetU stores on your device.</p></div></section></main><footer class="site-ftr"><div class="wrap ftr-top"><div class="ftr-brand"> <a class="ftr-logo" href="/" aria-label="IkonetU home"><svg aria-hidden="true" width="148.5" height="34" viewBox="0 0 148.51 34.00" style="display:block;flex:none"><g transform="translate(-7.286 -2.429) scale(0.8095)"><path d="M9 4.5 Q9 3 10.5 3 L37.5 3 Q39 3 39 4.5 L39 10.5 Q39 12 37.5 12 L34.5 12 Q33 12 33 13.5 L33 28.5 Q33 30 31.5 30 L28.5 30 Q27 30 27 28.5 L27 13.5 Q27 12 25.5 12 L10.5 12 Q9 12 9 10.5 Z" fill="#FFFFFF"></path><path d="M39 43.5 Q39 45 37.5 45 L10.5 45 Q9 45 9 43.5 L9 37.5 Q9 36 10.5 36 L13.5 36 Q15 36 15 34.5 L15 19.5 Q15 18 16.5 18 L19.5 18 Q21 18 21 19.5 L21 34.5 Q21 36 22.5 36 L37.5 36 Q39 36 39 37.5 Z" fill="#F26B1D"></path></g><g transform="translate(33.651 8.053) scale(0.02402)"><path d="M72 745V0H208V745Z M426.0 745V0H562.0V388L525.0 375L842.0 0H1013.0L716.0 352L724.0 256L1022.0 745H862.0L662.0 417L562.0 536V745Z M1527.0 757Q1445.0 757 1374.0 728.0Q1303.0 699 1250.0 647.0Q1197.0 595 1167.5 524.5Q1138.0 454 1138.0 372Q1138.0 289 1167.0 219.0Q1196.0 149 1249.0 97.0Q1302.0 45 1373.0 16.5Q1444.0 -12 1527.0 -12Q1610.0 -12 1681.0 17.0Q1752.0 46 1805.0 97.5Q1858.0 149 1887.5 219.0Q1917.0 289 1917.0 372Q1917.0 454 1887.0 524.5Q1857.0 595 1804.0 647.0Q1751.0 699 1680.5 728.0Q1610.0 757 1527.0 757ZM1527.0 633Q1582.0 633 1628.0 613
